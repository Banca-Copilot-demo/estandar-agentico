[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indice-agentico"
version = "0.1.0"
description = "Genera el indice de plugins agenticos del estandar exigiendo atestacion verificada."
requires-python = ">=3.11"
# El marketplace se valida contra `marketplace.schema.json` ANTES de escribirlo: publicar un indice que
# algun cliente no sabra instalar es peor que no publicar.
dependencies = ["jsonschema>=4.21"]

[project.scripts]
generar-indice = "indice_agentico.cli:main"

[tool.setuptools.packages.find]
include = ["indice_agentico*"]
