[project]
name = "validador-agentico"
version = "0.1.0"
description = "Validador de artefactos agenticos: gates G1, G3 y G4."
requires-python = ">=3.11"
# Solo para comprobar que el frontmatter es YAML VALIDO. La extraccion no lo usa.
dependencies = ["pyyaml>=6"]

[project.scripts]
validar-artefactos = "validador_agentico.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["validador_agentico*"]
