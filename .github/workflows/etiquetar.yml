name: Etiquetar la version

# WORKFLOW REUTILIZABLE. Lo invocan los repositorios de dominio al mergear a main.
#
# QUE RESUELVE: la etiqueta era el unico numero que una persona teclea a mano, y ya estaba declarado
# en el manifiesto y revisado en el pull request. Teclearlo dos veces solo anade un sitio donde
# equivocarse -- y con releases inmutables, un release publicado con la etiqueta equivocada NO se
# puede borrar.
#
# POR QUE NECESITA EL TOKEN DE LA APP Y NO LE BASTA EL GITHUB_TOKEN: esta MEDIDO en la documentacion
# de GitHub -- «events triggered by the GITHUB_TOKEN will not create a new workflow run» --. Una
# etiqueta empujada con el GITHUB_TOKEN NO dispararia `publicar.yml`, asi que el artefacto quedaria
# etiquetado y sin publicar, en silencio. Con el token de la App el evento si propaga.

on:
  workflow_call:
    secrets:
      app-id:
        description: App ID de la App del ciclo de vida.
        required: false
      app-key:
        description: Clave privada de esa App.
        required: false

permissions:
  contents: read

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      # SIN LA APP, ESTO NO SE PUEDE HACER, y el workflow lo dice y para en verde en vez de fallar.
      # Un rojo en CADA merge -- cuando lo que falta es una credencial de la organizacion y no un
      # defecto del cambio -- ensena al equipo a ignorar los fallos de CI, que es peor que no tener
      # el paso. El aviso queda en el resumen del job y la publicacion sigue disponible etiquetando
      # a mano.
      - name: ¿Estan los secretos de la App?
        id: app
        env:
          APP_ID: ${{ secrets.app-id }}
          APP_KEY: ${{ secrets.app-key }}
        run: |
          # LA CLAVE SE COMPRUEBA AQUI, y no se deja para la accion que la usa. MEDIDO en la primera
          # ejecucion con los secretos puestos: una clave mal pegada no da un mensaje sobre la clave,
          # da `ERR_OSSL_ASN1_TOO_LONG` y `Invalid keyData` dentro de un rastro de Node. Quien lo lee
          # no tiene forma de saber que lo que hay que arreglar es un secreto de la organizacion.
          if [ -n "${APP_KEY:-}" ] && ! printf '%s' "$APP_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            {
              echo "## La clave de la App no tiene la forma de una clave"
              echo
              echo "\`APP_KEY_AGENTICO\` existe pero no contiene la linea \`-----BEGIN ... PRIVATE KEY-----\`."
              echo
              echo "Tiene que ser el CONTENIDO COMPLETO del archivo \`.pem\` que GitHub descarga al"
              echo "generar la clave privada -- las lineas \`BEGIN\`/\`END\` incluidas y los saltos de"
              echo "linea tal cual --. No vale la huella digital, ni el archivo en base64."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::APP_KEY_AGENTICO no es una clave privada PEM"
            exit 1
          fi
          if [ -z "${APP_ID:-}" ]; then
            {
              echo "## Etiquetado automatico no disponible"
              echo
              echo "Faltan los secretos \`APP_ID_AGENTICO\` y \`APP_KEY_AGENTICO\`."
              echo
              echo "El GITHUB_TOKEN no sirve para esto: una etiqueta empujada con el no dispara"
              echo "\`publicar.yml\`, asi que el artefacto quedaria etiquetado y SIN publicar."
              echo
              echo "Mientras no esten, etiqueta a mano con la version del manifiesto."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::etiquetado automatico omitido: faltan los secretos de la App"
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Token de la App, para que la etiqueta SI dispare la publicacion
        if: steps.app.outputs.hay == 'si'
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-key }}
          owner: ${{ github.repository_owner }}

      - name: Descargar el repositorio con su historial de etiquetas
        if: steps.app.outputs.hay == 'si'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      # LA VERSION DEL PAQUETE, no la de cada artefacto. El orden de las fuentes es deliberado: el
      # manifiesto del plugin manda cuando existe, porque es lo que el marketplace resuelve; y un
      # repositorio de artefactos SUELTOS la declara en su GOVERNANCE.json.
      - name: Resolver la version del paquete
        if: steps.app.outputs.hay == 'si'
        id: version
        run: |
          if [ -f .claude-plugin/plugin.json ]; then
            version="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
            fuente=".claude-plugin/plugin.json"
          elif [ -f GOVERNANCE.json ]; then
            version="$(jq -r '.version // empty' GOVERNANCE.json)"
            fuente="GOVERNANCE.json"
          fi
          if [ -z "${version:-}" ]; then
            echo "::error::no hay version de paquete que etiquetar. Declarala en .claude-plugin/plugin.json o en GOVERNANCE.json"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::la version de $fuente no es SemVer: $version"
            exit 1
          fi
          echo "valor=$version"  >> "$GITHUB_OUTPUT"
          echo "fuente=$fuente"  >> "$GITHUB_OUTPUT"

      # NO SE REESCRIBE UNA ETIQUETA EXISTENTE. Si la version no subio, no hay nada que publicar:
      # ese es el mecanismo por el que mergear no publica siempre. Y reescribirla romperia el
      # contrato de que una etiqueta apunta para siempre al mismo commit.
      - name: Etiquetar si la version es nueva
        if: steps.app.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.version.outputs.valor }}
          FUENTE: ${{ steps.version.outputs.fuente }}
        run: |
          etiqueta="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${etiqueta}" >/dev/null; then
            echo "La etiqueta ${etiqueta} ya existe: la version no subio en este merge, no hay nada que publicar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "agentico-ciclo-de-vida[bot]"
          git config user.email "agentico-ciclo-de-vida[bot]@users.noreply.github.com"
          git tag -a "${etiqueta}" -m "Version ${VERSION}, declarada en ${FUENTE}"
          git push origin "${etiqueta}"
          {
            echo "## Etiquetado"
            echo
            echo "| Qué | Valor |"
            echo "|---|---|"
            echo "| Etiqueta | \`${etiqueta}\` |"
            echo "| Declarada en | \`${FUENTE}\` |"
            echo
            echo "La publicación arranca ahora, disparada por esta etiqueta."
          } >> "$GITHUB_STEP_SUMMARY"
