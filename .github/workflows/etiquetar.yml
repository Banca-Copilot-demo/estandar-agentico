name: Etiquetar la version

# WORKFLOW REUTILIZABLE. Lo invocan los repositorios de dominio al mergear a main.
#
# QUE RESUELVE: la etiqueta era el unico numero que una persona teclea a mano, y ya estaba declarado
# en el manifiesto y revisado en el pull request. Teclearlo dos veces solo anade un sitio donde
# equivocarse -- y con releases inmutables, un release publicado con la etiqueta equivocada NO se
# puede borrar.
#
# POR QUE NECESITA EL TOKEN DE LA APP Y NO LE BASTA EL GITHUB_TOKEN: esta MEDIDO en la documentacion
# de GitHub -- «events triggered by the GITHUB_TOKEN will not create a new workflow run» --. Una
# etiqueta empujada con el GITHUB_TOKEN NO dispararia `publicar.yml`, asi que el artefacto quedaria
# etiquetado y sin publicar, en silencio. Con el token de la App el evento si propaga.

on:
  # ESTE REPOSITORIO TAMBIEN SE ETIQUETA. Ver el comentario equivalente en `publicar.yml`: el
  # asistente de autoria es un plugin como cualquier otro y sigue el mismo camino.
  push:
    branches: [main]
  workflow_call:
    secrets:
      app-id:
        description: App ID de la App del ciclo de vida.
        required: false
      app-key:
        description: Clave privada de esa App.
        required: false

permissions:
  contents: read

# Un workflow reutilizable no alcanza los archivos de SU repositorio: su checkout es el del llamador.
# Ver el comentario del paso que la usa.
env:
  VERSION_PYTHON: "3.12"

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    # DOS FUENTES PARA EL MISMO SECRETO, RESUELTAS UNA SOLA VEZ (Y3). Este workflow tiene dos
    # disparadores: invocado con `workflow_call` desde un repositorio de dominio, la credencial llega
    # como PARAMETRO (`secrets.app-id`); disparado por un `push` de este repositorio, ese parametro no
    # existe y hay que leerlo del propio repositorio u organizacion (`secrets.APP_ID_AGENTICO`).
    # MEDIDO: sin este `||`, la primera ejecucion por `push` dijo «faltan los secretos de la App» con
    # los secretos puestos -- leia el parametro vacio y culpaba a la credencial.
    #
    # LA EXPRESION VIVE AQUI Y NO EN CADA PASO porque estaba escrita DOS VECES en este mismo job --
    # en la comprobacion de presencia y en el acuñado del token -- y con dos copias basta con
    # arreglar una: la comprobacion diria que los secretos estan y el acuñado leeria vacio.
    env:
      APP_ID: ${{ secrets.app-id || secrets.APP_ID_AGENTICO }}
      APP_KEY: ${{ secrets.app-key || secrets.APP_KEY_AGENTICO }}
    steps:
      # SIN LA APP, ESTO NO SE PUEDE HACER, y el workflow lo dice y para en verde en vez de fallar.
      # Un rojo en CADA merge -- cuando lo que falta es una credencial de la organizacion y no un
      # defecto del cambio -- ensena al equipo a ignorar los fallos de CI, que es peor que no tener
      # el paso. El aviso queda en el resumen del job y la publicacion sigue disponible etiquetando
      # a mano.
      - name: ¿Estan los secretos de la App?
        id: app
        # `APP_ID` y `APP_KEY` llegan del `env` del job, donde se resuelven las dos fuentes una sola
        # vez.
        run: |
          # LA CLAVE SE COMPRUEBA AQUI, y no se deja para la accion que la usa. MEDIDO en la primera
          # ejecucion con los secretos puestos: una clave mal pegada no da un mensaje sobre la clave,
          # da `ERR_OSSL_ASN1_TOO_LONG` y `Invalid keyData` dentro de un rastro de Node. Quien lo lee
          # no tiene forma de saber que lo que hay que arreglar es un secreto de la organizacion.
          if [ -n "${APP_KEY:-}" ] && ! printf '%s' "$APP_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            {
              echo "## La clave de la App no tiene la forma de una clave"
              echo
              echo "\`APP_KEY_AGENTICO\` existe pero no contiene la linea \`-----BEGIN ... PRIVATE KEY-----\`."
              echo
              echo "Tiene que ser el CONTENIDO COMPLETO del archivo \`.pem\` que GitHub descarga al"
              echo "generar la clave privada -- las lineas \`BEGIN\`/\`END\` incluidas y los saltos de"
              echo "linea tal cual --. No vale la huella digital, ni el archivo en base64."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::APP_KEY_AGENTICO no es una clave privada PEM"
            exit 1
          fi
          if [ -z "${APP_ID:-}" ]; then
            {
              echo "## Etiquetado automatico no disponible"
              echo
              echo "Faltan los secretos \`APP_ID_AGENTICO\` y \`APP_KEY_AGENTICO\`."
              echo
              echo "El GITHUB_TOKEN no sirve para esto: una etiqueta empujada con el no dispara"
              echo "\`publicar.yml\`, asi que el artefacto quedaria etiquetado y SIN publicar."
              echo
              echo "Mientras no esten, etiqueta a mano con la version del manifiesto."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::etiquetado automatico omitido: faltan los secretos de la App"
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Token de la App, para que la etiqueta SI dispare la publicacion
        if: steps.app.outputs.hay == 'si'
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Descargar el repositorio con su historial de etiquetas
        if: steps.app.outputs.hay == 'si'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      # LA VERSION DEL PAQUETE, no la de cada artefacto. El orden de las fuentes es deliberado: el
      # manifiesto del plugin manda cuando existe, porque es lo que el marketplace resuelve; y un
      # repositorio de artefactos SUELTOS la declara en su GOVERNANCE.json.
      # PYTHON PORQUE EL DESCUBRIMIENTO DE PLUGINS ES UNA REGLA DEL ESTANDAR, no de CI. La
      # ejecuta `validador_agentico.listar_plugins`, que reutiliza la MISMA regla que el gate: si
      # el etiquetado y el gate discreparan sobre que es un plugin, se crearia una etiqueta para
      # algo que la publicacion no encuentra -- y con releases inmutables esa etiqueta no se borra.
      # ESTE WORKFLOW NO PUEDE LEER `.python-version`, y es una restriccion de la plataforma que se
      # APRENDIO ROMPIENDOLO. Es de doble modo: por `push` corre en el repositorio del estandar --
      # donde el archivo existe -- y por `workflow_call` corre en el del DOMINIO, cuyo checkout NO lo
      # contiene. El primer intento apuntaba al archivo, y el etiquetado del dominio murio con «The
      # specified python version file at: .python-version doesn't exist» mientras las corridas del
      # propio estandar seguian EN VERDE: el peor reparto posible, porque el fallo aparece solo en el
      # consumidor y no en quien hizo el cambio.
      #
      # Las composite actions NO tienen este problema: resuelven el archivo con `github.action_path`,
      # que apunta a la accion y no al workspace del llamador.
      #
      # Asi que la version vive en el `env` de este workflow. Es el SEGUNDO y ultimo literal en el
      # repositorio -- el otro es `.python-version`, que cubre los otros cinco sitios -- y es una
      # variable de nivel de workflow, que es la forma que Y2 pide.
      - name: Preparar Python ${{ env.VERSION_PYTHON }}
        if: steps.app.outputs.hay == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSION_PYTHON }}

      - name: Instalar el validador del estandar
        if: steps.app.outputs.hay == 'si'
        shell: bash
        run: pip install --quiet "git+https://github.com/${{ github.repository_owner }}/estandar-agentico.git@main#subdirectory=validador"

      # UNA ETIQUETA POR PLUGIN. Un repositorio de dominio puede alojar varios, y entonces `vX.Y.Z`
      # seria ambiguo: no diria de cual. La forma `<nombre>--vX.Y.Z` es la convencion del cliente
      # -- la misma que crea `claude plugin tag` --. Un repositorio de un solo plugin en la raiz
      # conserva `vX.Y.Z`, porque sus etiquetas ya publicadas no se pueden reescribir.
      #
      # NO SE REESCRIBE UNA ETIQUETA EXISTENTE. Si la version no subio, no hay nada que publicar:
      # ese es el mecanismo por el que mergear no publica siempre.
      - name: Etiquetar los plugins cuya version sea nueva
        if: steps.app.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          git config user.name  "agentico-ciclo-de-vida[bot]"
          git config user.email "agentico-ciclo-de-vida[bot]@users.noreply.github.com"

          plugins="$(python -m validador_agentico.listar_plugins .)"
          if [ -z "$plugins" ]; then
            echo "Sin plugin que etiquetar: los artefactos sueltos se instalan por su propio canal." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          nuevas=0
          echo "## Etiquetado"      >> "$GITHUB_STEP_SUMMARY"
          echo ""                   >> "$GITHUB_STEP_SUMMARY"
          echo "| Plugin | Version | Etiqueta | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|"  >> "$GITHUB_STEP_SUMMARY"

          # El separador se construye con printf: un tabulador literal dentro del YAML es
          # fragil, porque los editores y los formateadores lo convierten en espacios.
          TAB="$(printf '\t')"
          # LA ETIQUETA LLEGA CALCULADA, en una cuarta columna, y este bash ya no la construye. Se
          # decidia aqui con «si la subruta es . entonces vX.Y.Z», y se equivoco en cuanto aparecio el
          # repositorio MIXTO: el conjunto suelto tiene subruta `.` y NO esta solo, asi que en
          # `agentes-sdlc` se creo un `v1.0.0` conviviendo con cuatro etiquetas nombradas --
          # significando «todo excepto los plugins», una definicion por resta que nadie deduce --. La
          # forma depende de si el REPOSITORIO publica una unidad o varias, un dato que este bucle no
          # tiene.
          #
          # Es el contrato mas caro de equivocar de toda la cadena: con releases inmutables una
          # etiqueta mal puesta NO SE BORRA. Ahora la decide `dominio.reglas_etiquetas`, con pruebas.
          while IFS="$TAB" read -r ruta nombre version etiqueta; do
            [ -n "$nombre" ] || continue
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::la version de $ruta no es SemVer: $version"
              exit 1
            fi
            if [ -z "$etiqueta" ]; then
              echo "::error::el descubrimiento no emitio etiqueta para $nombre: no se etiqueta a ciegas"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${etiqueta}" >/dev/null; then
              echo "| \`$nombre\` | $version | \`$etiqueta\` | ya existia, la version no subio |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git tag -a "$etiqueta" -m "Plugin $nombre, version $version"
            git push origin "$etiqueta"
            nuevas=$((nuevas+1))
            echo "| \`$nombre\` | $version | \`$etiqueta\` | **etiquetado** |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$plugins"

          echo ""                   >> "$GITHUB_STEP_SUMMARY"
          if [ "$nuevas" -gt 0 ]; then
            echo "La publicacion arranca ahora, disparada por $nuevas etiqueta(s)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ninguna version subio: no hay nada que publicar." >> "$GITHUB_STEP_SUMMARY"
          fi
