name: Pruebas del estandar

# El validador es el gate de todos los dominios: si se rompe, el estandar deja de ser exigible.
# Sus pruebas son PURAS -el dominio no toca disco- asi que corren en segundos y sin credenciales.

# Se prueba TODO lo que decide si un artefacto se publica: el validador y el empaquetador. Los dos
# son infraestructura de la que dependen todos los dominios, y los dos fallan en silencio si nadie
# los prueba -- el empaquetador con especial facilidad: un digest inestable no rompe nada visible,
# solo hace que la atestacion no pruebe nada.
# `port/**` ESTABA IGUAL DE AUSENTE, y por la misma razon exacta que `schemas/**`: la prueba del
# contrato del catalogo lee `port/blueprint-artefacto-agentico.json` del repositorio, o sea que el
# blueprint es tambien una ENTRADA de la suite. Editar el contrato del catalogo no disparaba la prueba
# que existe para vigilar precisamente su deriva. Es el mismo defecto que el parrafo de abajo dice
# haber corregido, reintroducido en el archivo de al lado -- que es lo que pasa cuando la correccion se
# escribe como comentario y no como regla comprobable --.
#
# `schemas/**` ESTA EN LA LISTA, y faltaba. Las pruebas dejaron de ser independientes de los esquemas
# el dia que empezaron a validar contra los REALES del repositorio -- cuatro archivos de prueba los
# leen --, asi que un esquema es hoy una ENTRADA de la suite. Sin este filtro, cambiar un esquema no
# disparaba las pruebas que dependen de el: se podia romper la validacion de forma y CI callaba.
#
# LA LISTA ESTA DOS VECES A LA FUERZA. Se intento con una ancla YAML (`&`/`*`) para no repetirla, y NO
# vale: el archivo parsea como YAML correcto pero GitHub Actions no resuelve anclas ni alias, asi que
# el disparador de `push` se habria quedado sin filtro sin dar ningun error. Es una limitacion de la
# plataforma, no una eleccion: si las dos listas divergen, el sintoma es que las pruebas corren en los
# pull requests y no en `main`, o al contrario.
on:
  pull_request:
    paths: ["validador/**", "indice/**", "schemas/**", "port/**", ".github/actions/publicar/**", "plugins/**"]
  push:
    branches: [main]
    paths: ["validador/**", "indice/**", "schemas/**", "port/**", ".github/actions/publicar/**", "plugins/**"]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio del estandar
        uses: actions/checkout@v4

      - name: Preparar Python (version del estandar)
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Instalar el validador, el generador del indice y pytest
        shell: bash
        run: pip install --quiet -e validador -e indice pytest

      - name: Pruebas del validador
        working-directory: validador
        shell: bash
        run: python -m pytest tests -q

      # Estas son las que impiden que entre al indice algo sin atestacion verificada. Si se rompen,
      # el estandar deja de ser exigible aunque todo lo demas siga en verde.
      - name: Pruebas del generador del indice
        working-directory: indice
        shell: bash
        run: python -m pytest tests -q

  empaquetado:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio del estandar
        uses: actions/checkout@v4

      # Se empaqueta ESTE repositorio: sirve cualquiera con archivos versionados, y usar el propio
      # evita depender de otro repo -- y de un token que pudiera leerlo.
      - name: Comprobar que el empaquetado es determinista
        shell: bash
        run: bash .github/actions/publicar/probar-empaquetado.sh .

  estados_de_instalacion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio del estandar
        uses: actions/checkout@v4

      # El skill de instalacion decide si algo se INSTALA, asi que sus codigos de salida se prueban.
      # El defecto que fija esta prueba fue de MEDICION: `comprobar-estado.sh retired | head` devolvia
      # 0 porque `$?` era el de `head`. Parecia que un artefacto retirado no bloqueaba.
      - name: Comprobar los codigos de salida del estado
        shell: bash
        run: bash plugins/asistente-autoria/skills/instalar-artefacto-agentico/scripts/probar-estados.sh

      # La etiqueta la construye el asistente para el `pip install` del validador, y su fallo no lo
      # ve CI: lo ve el desarrollador la primera vez que usa el skill. De ahi que se pruebe aqui.
      - name: Comprobar la resolucion de la etiqueta del estandar
        shell: bash
        run: bash plugins/asistente-autoria/skills/crear-artefacto-agentico/scripts/probar-etiqueta.sh
