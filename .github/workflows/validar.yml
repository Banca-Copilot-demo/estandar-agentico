name: Validar artefactos agenticos

# WORKFLOW REUTILIZABLE. No corre solo: lo invocan los repositorios de dominio.
#
# POR QUE VIVE AQUI: un gate que el evaluado pueda borrar no es un gate. Los dominios lo
# llaman por referencia y GitHub lo trae en tiempo de ejecucion, asi que hay UN SOLO SITIO
# donde corregir una comprobacion.
#
# POR QUE NO CLONA ESTE REPOSITORIO: el GITHUB_TOKEN esta acotado al repositorio del
# LLAMADOR, asi que no puede leer este repo si es privado. En su lugar se usa una accion
# COMPUESTA, que GitHub resuelve por la politica de acceso de Actions sin necesitar token.
#
# SIGUE SIN USAR `secrets: inherit` a proposito -- heredar en bloque invertiria la relacion de
# confianza con cada repositorio que lo llama --, pero ahora acepta DOS secretos NOMBRADOS y
# OPCIONALES, que es otra cosa: el llamador decide que entrega, y solo eso.
#
# POR QUE HICIERON FALTA, y no estaban en la version anterior de este archivo: G4 exige que el
# `owner_team` declarado EXISTA en la organizacion, y el `GITHUB_TOKEN` de Actions esta acotado al
# repositorio. MEDIDO en una ejecucion real: `gh api orgs/<org>/teams` responde
# «Resource not accessible by integration (HTTP 403)», el validador no puede comprobar y degrada a
# AVISO. Resultado: un artefacto podia declarar como dueno un equipo inexistente y publicarse en verde,
# que es justo lo que la regla existe para impedir.
#
# SON OPCIONALES A PROPOSITO: sin ellos el gate sigue corriendo y avisa de que no pudo resolver, en vez
# de fallar. Un repositorio que aun no tenga la App configurada tiene que poder validar.

on:
  workflow_call:
    secrets:
      app-id:
        description: App ID de la App del ciclo de vida. Sin el, el dueno no se resuelve y se avisa.
        required: false
      app-key:
        description: Clave privada de esa App.
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validar:
    runs-on: ubuntu-latest
    # EL SECRETO SE PASA POR `env` DEL JOB, y no se consulta directamente en el `if` de un paso.
    #
    # EL DEFECTO QUE ESTO CORRIGE, y es de los caros: `if: ${{ secrets.app-id != '' }}` a nivel de
    # PASO no es sintaxis valida -- el contexto `secrets` no existe ahi --, y GitHub lo rechaza al
    # ARRANCAR el workflow: «Unrecognized named-value: 'secrets'».
    #
    # CONSECUENCIA MEDIDA: el gate llevaba fallando en `startup_failure` en TODOS los pull requests,
    # o sea que no corria ninguna comprobacion y todo se mergeaba sin validar. Y fallaba de la peor
    # forma posible: en 0 segundos, sin jobs, sin anotaciones y sin log -- la interfaz solo mostraba
    # el nombre del ARCHIVO en vez del nombre del workflow, que es la unica señal de que ni siquiera
    # llego a cargarse --.
    env:
      APP_ID: ${{ secrets.app-id }}
    steps:
      - name: Descargar el repositorio evaluado
        uses: actions/checkout@v4

      # SE ACUÑA UN TOKEN DE LA APP SOLO PARA RESOLVER EL DUENO. Con `continue-on-error` porque su
      # ausencia NO debe tumbar la validacion: sin token el gate corre igual y avisa de que no pudo
      # comprobar el equipo. Un repositorio sin la App configurada tiene que poder validar.
      - name: Token de la App (para resolver los equipos de la organizacion)
        id: token
        if: ${{ env.APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-key }}
          owner: ${{ github.repository_owner }}

      - name: Ejecutar los gates
        uses: Banca-Copilot-demo/estandar-agentico/.github/actions/validar@main
        with:
          # El de la App si se pudo acuñar; si no, cadena vacia y la accion cae al token del
          # repositorio -- que sirve para todo menos para leer los equipos --.
          token-organizacion: ${{ steps.token.outputs.token }}
