name: Publicar version

# WORKFLOW REUTILIZABLE. Lo invocan los repositorios de dominio al empujar una etiqueta.
#
# POR QUE VIVE AQUI Y NO EN CADA DOMINIO: es el paso que CONVIERTE contenido en algo instalable.
# Si cada dominio tuviera su propia copia, cada equipo podria quitarse el sello, el empaquetado
# determinista o la revalidacion, y el indice no podria confiar en nada.
#
# LO QUE ESTE WORKFLOW YA NO HACE: EVALUAR. La suite se ejecuta UNA sola vez por artefacto, en la
# solicitud de cambio. Aqui solo se PREGUNTA por el resultado de aquella corrida, con dos
# comprobaciones deterministas y gratis -- ver el job `certificable` --. Ver tambien la cabecera de
# `evaluar.yml`: el motivo es que el veredicto no es reproducible, asi que una segunda corrida no
# confirma la primera; solo la contradice a veces y gasta el doble de cuota.
#
# LO QUE ESTE WORKFLOW NO HACE: no escribe en el repositorio del dominio. Lo que sale de aqui son
# tres cosas inmutables -- una etiqueta, un paquete firmado y dos atestaciones --. El veredicto NO
# se commitea en `GOVERNANCE.json`: seria un bucle de commits, y meter el digest dentro del
# archivo que se hashea es circular.

on:
  # ESTE REPOSITORIO TAMBIEN PUBLICA. Ofrece este workflow a los repositorios de dominio Y lo aplica
  # a su propio plugin, que vive en `plugins/asistente-autoria/` como en cualquier otro repo. Es la
  # unica forma de que el asistente de autoria entre al catalogo con su etiqueta, su release y su
  # firma en vez de por una entrada escrita a mano — que es justo el atajo que el track cierra.
  #
  # Un archivo puede declarar los dos disparadores: `workflow_call` para quien lo invoca y `push`
  # para si mismo. La logica no se duplica, que es lo que pasaria con un workflow llamador aparte.
  push:
    tags:
      - "v*.*.*"
      - "*--v*.*.*"
  workflow_call:
    inputs:
      repositorio-indice:
        description: Repositorio del indice al que avisar. Vacio = no se avisa.
        required: false
        type: string
        default: ""
    secrets:
      port-client-id:
        description: Client ID de Port. Sin el, no se publica la ficha del catalogo.
        required: false
      port-client-secret:
        description: Client secret de Port.
        required: false
      app-id:
        description: >
          App ID de la App del ciclo de vida. Se usa SOLO para acunar un token efimero con el que
          disparar un evento en el repositorio del indice -- no se escribe nada alli --. Opcional:
          sin el, la publicacion se completa y el indice se pone al dia en su pasada programada.
        required: false
      app-key:
        description: Clave privada de esa App. Solo sirve para pedir tokens, nunca es un token.
        required: false
      # `copilot-token` SE RETIRO DE AQUI. Existia para la segunda corrida de la suite, la que
      # certificaba sobre el commit etiquetado; sin ella, publicar no habla con ningun modelo y no
      # tiene ningun uso para un token de inferencia. Sigue existiendo donde se evalua de verdad --
      # el `evaluar.yml` que llama la validacion del pull request --. Un secreto declarado y sin
      # consumidor es una invitacion a volver a cablear la evaluacion aqui.

# EL PERMISO MINIMO PARA CADA COSA, y ni uno mas:
#   contents: write        -> crear el release y subirle el paquete
#   id-token: write        -> el OIDC de Sigstore; es lo que hace la firma sin claves guardadas
#   attestations: write    -> registrar las dos atestaciones en el repositorio
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    outputs:
      # La subruta de la unidad publicada. La necesita la certificacion para acotarse a ELLA: sin
      # eso, un artefacto se quedaria sin certificar por el estado de la suite de un vecino.
      subruta: ${{ steps.sellar.outputs.subruta }}
    steps:
      - name: Descargar el contenido que se va a sellar
        uses: actions/checkout@v4
        with:
          # El empaquetado sale de `git ls-files`, asi que necesita el repositorio, no un export.
          fetch-depth: 1

      - name: Sellar y publicar
        id: sellar
        uses: Banca-Copilot-demo/estandar-agentico/.github/actions/publicar@main
        with:
          repositorio-indice: ${{ inputs.repositorio-indice }}
          # DOS FUENTES, por los dos disparadores: como PARAMETRO cuando lo invoca un repositorio de
          # dominio, y del repositorio u organizacion cuando lo dispara un `push` de aqui. Las tres
          # son opcionales, asi que sin ellas la publicacion se completa igual -- la ficha y el aviso
          # al indice son aceleradores, la garantia la da el sello --.
          port-client-id: ${{ secrets.port-client-id || secrets.PORT_CLIENT_ID }}
          port-client-secret: ${{ secrets.port-client-secret || secrets.PORT_CLIENT_SECRET }}
          app-id: ${{ secrets.app-id || secrets.APP_ID_AGENTICO }}
          app-key: ${{ secrets.app-key || secrets.APP_KEY_AGENTICO }}

  # DECIDE SI EL ARTEFACTO SE CERTIFICA, Y NO VUELVE A EVALUAR NADA.
  #
  # POR QUE NO SE EVALUA AQUI. Hasta ahora este sitio lanzaba una segunda corrida de la suite, sobre
  # el commit etiquetado. La justificacion era «certificar por lo que se vio en otro sitio seria
  # certificar de oidas», y la medicion la desmintio: el veredicto NO es reproducible -- la MISMA
  # suite sobre el MISMO contenido dio 3 de 3 en el pull request, 2 de 3 al certificar y verde al
  # reejecutar --. Con un juez asi, la segunda corrida no confirma la primera: solo anade una segunda
  # tirada de dado, y cuesta otra vez cuota del unico token de inferencia de la organizacion. Ademas
  # el contenido es literalmente el mismo: el etiquetado es automatico justo tras el merge, asi que
  # la etiqueta apunta al commit del merge.
  #
  # LAS DOS PREGUNTAS QUE SI SE HACEN SON DETERMINISTAS Y GRATIS, y ninguna se la hace a un modelo:
  #
  #   1) ¿LA UNIDAD PUBLICADA TRAE SUITES? Con la MISMA deteccion que usa la evaluacion -- la accion
  #      `detectar-suites` --, acotada a la subruta que se publica.
  #   2) ¿ESTA EN VERDE LA COMPROBACION DE COMPORTAMIENTO DE ESE COMMIT? Por la API de check-runs.
  #
  # HACEN FALTA LAS DOS, y la primera es la que impide el fallo mas facil de cometer aqui: un
  # artefacto SIN suites tambien sale VERDE, porque el trabajo se salta y un trabajo saltado reporta
  # «Success» -- MEDIDO --. Mirar solo el color certificaria artefactos que nadie evaluo, que es lo
  # contrario del proposito del estado.
  certificable:
    needs: publicar
    runs-on: ubuntu-latest
    # NO SE DECLARA `checks: read` AUNQUE ES LO QUE HACE FALTA PARA LEER LA COMPROBACION, y la razon
    # esta medida en este mismo repositorio con otro permiso. Un workflow reutilizable NO puede pedir
    # mas permisos de los que le concede su llamador: los repositorios de dominio conceden hoy
    # `contents`, `id-token` y `attestations`, asi que `checks` les vale `none`. Pedirlo aqui no
    # degradaria este job -- mataria el workflow ENTERO en `startup_failure`, antes de empaquetar y
    # sellar --, que es exactamente lo que ya paso cuando se pidio `copilot-requests: write` y una
    # organizacion sin asientos no pudo concederlo: un permiso para CERTIFICAR mataba el PUBLICAR.
    #
    # Sin pedirlo, un llamador que aun no lo conceda recibe un 403 EN EJECUCION, no promociona y se
    # entera de por que. Anadir `checks: read` a su bloque de permisos es entonces una linea.
    #
    # LO MISMO VALE PARA `pull-requests: read`, que ahora tambien hace falta: la medicion cuelga del
    # commit de la RAMA -- la suite se ejecuta una sola vez, en la solicitud de cambio -- y para saber
    # cual era hay que preguntar de que pull request nacio el commit etiquetado. Sin ese permiso, la
    # consulta responde 403, se avisa, se mira solo el commit etiquetado y el artefacto se queda en
    # Conforme con la razon escrita. Degradar, nunca dar por verde lo que no se pudo comprobar.
    outputs:
      promociona: ${{ steps.decidir.outputs.promociona }}
    steps:
      - name: Descargar el contenido etiquetado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: ¿La unidad publicada trae suites?
        id: suites
        uses: Banca-Copilot-demo/estandar-agentico/.github/actions/detectar-suites@main
        with:
          # ACOTADA A LA UNIDAD QUE SE PUBLICA. Sin esto se miraria TODO el repositorio, y esta medido
          # lo que pasa con eso: `revisar-jql` pasaba sus 3 de 3 y aun asi no se certificaba, porque
          # la suite de un agente de OTRO plugin estaba en rojo. Cada unidad responde solo de lo suyo.
          subruta: ${{ needs.publicar.outputs.subruta }}

      # DE QUE COMMIT COLGO LA MEDICION. No es el que se etiqueta, y esa diferencia es la que dejaba
      # al guardian apoyandose sin querer en una segunda evaluacion que no debia existir.
      #
      # La suite se ejecuta UNA sola vez, en la solicitud de cambio, o sea sobre el sha de la RAMA. El
      # merge con squash crea un commit NUEVO en `main` -- otro sha -- y es ese el que se etiqueta, asi
      # que preguntar por las comprobaciones del commit etiquetado es preguntar por un commit que
      # nadie evaluo. Funcionaba solo porque el push a `main` volvia a evaluarlo todo: la respuesta
      # llegaba de la pasada que sobraba, la que duplicaba el gasto del unico token de inferencia.
      #
      # NO SE TRANSPORTA NADA, SE PREGUNTA DE DONDE VENIA. Un check-run no caduca, asi que la medicion
      # del pull request sigue existiendo sobre el sha de la rama; lo unico que faltaba era el puente
      # entre los dos commits, y la propia API lo da: `/commits/{sha}/pulls` devuelve la solicitud de
      # cambio que INTRODUJO ese commit. Las alternativas se descartaron por coste, no por gusto: un
      # artefacto de corrida caduca a los 30 dias y habria exigido `actions: read` en cada dominio, y
      # re-publicar las comprobaciones sobre `main` habria exigido `checks: write` y una segunda copia
      # de la misma verdad, que puede divergir.
      #
      # SI NO SE PUEDE RESOLVER, NO SE INVENTA. Un commit que no llego por un pull request -- un push
      # directo a main -- no tiene medicion recuperable, y eso NO es «paso»: es «no se sabe». Se sigue
      # mirando tambien el propio commit etiquetado, por si alguien evaluo ahi a mano.
      - name: ¿Que commit se evaluo, si el etiquetado nacio de un squash?
        id: origen
        if: steps.suites.outputs.hay-suites == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `pipefail` por el mismo motivo que abajo: la consulta es una tuberia y sin el, un 403 se
          # leeria como «este commit no vino de ningun pull request».
          set -o pipefail
          sha="$(git rev-parse HEAD)"
          echo "etiquetado=$sha" >> "$GITHUB_OUTPUT"
          if ! rama="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
                         --jq '.[0].head.sha // ""' | tail -1)"; then
            echo "::warning::no se pudo preguntar de que pull request nacio $sha (¿falta \`pull-requests: read\`?): solo se mirara el commit etiquetado"
            rama=""
          fi
          echo "rama=$rama" >> "$GITHUB_OUTPUT"
          if [ -n "$rama" ]; then
            echo "el commit etiquetado $sha nacio del pull request cuya rama estaba en $rama: ahi vive la medicion"
          else
            echo "::warning::$sha no se puede asociar a ningun pull request: si nadie evaluo ese commit directamente, no habra medicion que recuperar y el artefacto se quedara en Conforme"
          fi

      - name: ¿Esta en verde la comprobacion de comportamiento de ESTA unidad?
        id: decidir
        if: steps.suites.outputs.hay-suites == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # EL NOMBRE DEL JOB QUE EMITE LA COMPROBACION lo declara `evaluar.yml`, y aqui se busca por
          # SUFIJO: GitHub nombra el check-run de un workflow reutilizable
          # `<job del llamador> / <nombre del job llamado>`, y el prefijo lo elige cada repositorio de
          # dominio. Lo unico que el estandar controla -- y por tanto lo unico contra lo que se puede
          # comparar sin acertar de casualidad -- es la segunda mitad. Hay una prueba de forma que
          # falla si este texto y el `name:` de `evaluar.yml` dejan de coincidir.
          #
          # Y AHORA LLEVA LA SUBRUTA DE LA UNIDAD, que es el arreglo entero. Mientras hubo un solo
          # trabajo para todo el repositorio, esta pregunta era «¿esta verde el repositorio?», y su
          # respuesta la decidia la peor suite de cualquier vecino: MEDIDO en el run 33040368778 de
          # `agentes-sdlc`, `revisar-jql` con 3 de 3 y `referencia` con 3 de 3 se quedaron en Conforme
          # porque `migracion` estaba en 2 de 3. La evaluacion abre un trabajo por unidad y nombra
          # cada uno con su subruta, asi que ahora existe una senal POR UNIDAD que preguntar -- y esa
          # es la que se pregunta --.
          #
          # EL SUFIJO SIGUE SIENDO SEGURO CON LA UNIDAD DENTRO: el separador « — » ancla el principio
          # del nombre de la unidad, asi que `plugins/mig` no puede coincidir con `plugins/migracion`.
          NOMBRE_DE_LA_COMPROBACION: Evaluacion de comportamiento — ${{ needs.publicar.outputs.subruta }}
          ETIQUETADO: ${{ steps.origen.outputs.etiquetado }}
          RAMA: ${{ steps.origen.outputs.rama }}
          # CUANTO SE ESPERA, Y POR QUE AHORA SE ESPERA MUCHO MENOS QUE ANTES.
          #
          # El tope viejo eran 25 minutos y estaban justificados: se corria contra el commit etiquetado
          # mientras el push a `main` lo estaba evaluando, asi que la publicacion adelantaba a la
          # medicion y no esperar significaba leer «en curso» casi siempre. Esa carrera ya no existe:
          # la medicion que se busca es la del pull request, y un pull request no se puede mergear
          # antes de que su comprobacion termine. Cuando la publicacion pregunta, la respuesta lleva
          # rato escrita.
          #
          # SE ESPERA UN POCO IGUAL, y no cero, por la consistencia eventual de la API y por el caso
          # en que alguien reejecute la comprobacion a mano. Al agotarse NO se promociona y se dice que
          # fue por eso -- «en curso» jamas se registra como «en rojo» --, asi que el artefacto se
          # queda en Conforme con la razon escrita y se puede promocionar a mano con `promocionar.yml`,
          # que acepta `workflow_dispatch`.
          ESPERA_MAXIMA_SEGUNDOS: "180"
          INTERVALO_DE_SONDEO_SEGUNDOS: "20"
        run: |
          # `pipefail` NO ES HIGIENE, ES LA CONDICION DE QUE EL 403 SE DETECTE. La consulta es una
          # tuberia `gh ... | tail -1`, y sin esto el estado de la tuberia es el de `tail`, que
          # siempre es 0: un `gh` que falla se leeria como «no hay comprobacion» -- COMPROBADO
          # ejecutando el bloque contra un `gh` que devuelve 1: sin `pipefail` daba «ausente» --. Es
          # el mismo modo de fallo que ya costo una medicion en este repositorio, donde
          # `comprobar-estado.sh | head` devolvia el codigo de `head`.
          set -o pipefail
          echo "promociona=false" >> "$GITHUB_OUTPUT"

          # DOS COMMITS DONDE MIRAR, Y EN ESTE ORDEN. El etiquetado primero porque si alguien evaluo
          # ahi a mano esa es la medicion mas reciente del contenido; la rama del pull request
          # despues, que es donde vive la medicion en el camino normal. Se salta el segundo si no se
          # pudo resolver o si coincide con el primero -- preguntar dos veces por el mismo sha solo
          # duplicaria la espera --.
          candidatos=("$ETIQUETADO")
          if [ -n "$RAMA" ] && [ "$RAMA" != "$ETIQUETADO" ]; then
            candidatos+=("$RAMA")
          fi
          echo "se buscara «...${NOMBRE_DE_LA_COMPROBACION}» en: ${candidatos[*]}"

          limite=$(( SECONDS + ESPERA_MAXIMA_SEGUNDOS ))
          conclusion=""
          estado="ausente"
          evaluado=""
          while :; do
            estado="ausente"
            conclusion=""
            fallo_la_consulta=""
            for sha in "${candidatos[@]}"; do
              # `--jq` filtra en el servidor de `gh`, no en un `grep` sobre JSON: el nombre lleva
              # espacios, barras y un guion largo, y un filtro de texto acertaria por accidente.
              if ! linea="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
                              --paginate --jq \
                              ".check_runs[] | select(.name | endswith(\"${NOMBRE_DE_LA_COMPROBACION}\")) \
                               | \"\(.status) \(.conclusion // \"\")\"" | tail -1)"; then
                # SE DISTINGUE «NO PUEDO PREGUNTAR» DE «NO ESTA EN VERDE». Confundirlos dejaria a un
                # repositorio sin promocionar nada para siempre por un permiso que falta, con el mismo
                # aviso que un artefacto que de verdad fallo su suite. Se anota y se sigue con el
                # otro candidato: que un sha no se pueda consultar no dice nada del otro.
                fallo_la_consulta=1
                continue
              fi
              if [ -n "$linea" ]; then
                estado="${linea%% *}"
                conclusion="${linea##* }"
                evaluado="$sha"
                break
              fi
            done

            # SOLO ES «SIN PERMISO» SI ADEMAS NO SE ENCONTRO NADA. Con la comprobacion localizada en
            # un candidato, que el otro diera 403 es irrelevante y decirlo confundiria el diagnostico.
            if [ "$estado" = ausente ] && [ -n "$fallo_la_consulta" ]; then
              estado="sin_permiso"
              break
            fi
            # `ausente` TAMBIEN ES ESPERAR, y no darse por vencido: la API tiene consistencia
            # eventual y alguien puede haber relanzado la comprobacion. Salir aqui leeria «aun no la
            # veo» como «no existe», que es el mismo error que leer «en curso» como «en rojo», y con
            # el mismo efecto: nada se certificaria nunca.
            case "$estado" in
              queued|in_progress|ausente) ;;
              *) break ;;
            esac
            [ "$SECONDS" -ge "$limite" ] && { [ "$estado" = ausente ] || estado="sin_terminar"; break; }
            echo "la comprobacion esta en $estado; se reintenta en ${INTERVALO_DE_SONDEO_SEGUNDOS}s"
            sleep "$INTERVALO_DE_SONDEO_SEGUNDOS"
          done

          # `skipped` NO CUENTA COMO VERDE, y es la razon de ser de este job: solo `success` certifica.
          if [ "$conclusion" = "success" ]; then
            echo "promociona=true" >> "$GITHUB_OUTPUT"
            echo "la comprobacion de comportamiento de esta unidad esta en verde sobre $evaluado: se promociona"
            exit 0
          fi
          # SE DICE POR QUE NO. Sin esto, un artefacto que merece certificarse se queda en Conforme y
          # nadie sabe si fue por no tener suites, por estar en rojo, por no poder preguntar o por no
          # haber sabido de que commit colgaba su medicion.
          case "$estado" in
            ausente)      razon="no aparecio ninguna comprobacion llamada «...$NOMBRE_DE_LA_COMPROBACION» sobre ${candidatos[*]}" ;;
            sin_permiso)  razon="no se pudo consultar la comprobacion: el llamador no concede \`checks: read\` a este workflow" ;;
            sin_terminar) razon="seguia en curso tras ${ESPERA_MAXIMA_SEGUNDOS}s de espera" ;;
            *)            razon="termino en «${conclusion:-sin conclusion}» sobre ${evaluado}, que no es verde" ;;
          esac
          # LA AUSENCIA NUNCA ES VERDE, Y SU MOTIVO SE ESCRIBE. Es la unica salvaguarda contra el
          # fallo que recorre toda esta cadena: leer «no se sabe» como «paso».
          echo "::warning::el artefacto trae suites pero no se promociona: $razon. Se queda en Conforme; se puede promocionar a mano cuando la comprobacion este en verde."

      - name: Avisar de que no hay comportamiento medido
        if: steps.suites.outputs.hay-suites != 'true'
        shell: bash
        # NO ES UN ERROR: es el resultado correcto. Nadie ha medido el comportamiento de esta unidad,
        # asi que no hay nada que certificar. Queda dicho para que el estado no se lea como un fallo.
        run: |
          echo "::notice::la unidad publicada no trae suites de evaluacion: se queda en Conforme, sin certificar."

  # SOLO SI LAS DOS CONDICIONES SE CUMPLEN. Sin suites, o con la comprobacion del commit que no esta
  # en verde, el artefacto se queda en Conforme: publicado y sellado, pero sin certificar.
  promocionar:
    needs: certificable
    if: needs.certificable.outputs.promociona == 'true'
    uses: Banca-Copilot-demo/estandar-agentico/.github/workflows/promocionar.yml@main
    with:
      etiqueta: ${{ github.ref_name }}
      # EL MISMO INDICE AL QUE AVISO LA PUBLICACION. Promocionar cambia lo que el indice debe mostrar
      # -- el artefacto pasa a distribuirse -- y sin avisar se queda fuera del catalogo hasta la
      # pasada diaria: certificado y no instalable.
      repositorio-indice: ${{ inputs.repositorio-indice }}
    # LA PROMOCION TAMBIEN ESCRIBE EN EL CATALOGO, y por eso necesita las mismas credenciales que la
    # publicacion. Sin ellas quitaba la marca de prelanzamiento -- el artefacto YA se distribuia -- y
    # dejaba la ficha diciendo `conformant`: el catalogo de metadata contradecia al instalable.
    #
    # UN WORKFLOW REUTILIZABLE NO HEREDA LOS SECRETOS DEL LLAMADOR: hay que pasarlos uno a uno o
    # declarar `secrets: inherit`. Se pasan uno a uno a proposito, para que lo que cada workflow
    # necesita quede escrito en su firma en vez de viajar entero y en silencio.
    #
    # LAS DOS FUENTES SON NECESARIAS, y quedarse solo con la de MAYUSCULAS no habria arreglado nada:
    # cuando a este workflow lo invoca un repositorio de DOMINIO, `secrets.PORT_CLIENT_ID` esta VACIO
    # -- dentro de un workflow reutilizable solo existen los secretos que el llamador paso -- y las
    # credenciales llegan por el parametro en minusculas. La forma de mayusculas cubre el otro
    # disparador, el `push` de etiqueta de este mismo repositorio. Es el mismo patron de las lineas
    # de arriba.
    #
    # NO SE ROMPE SI FALTAN: son opcionales, y entonces `promocionar` deja su aviso de que la ficha
    # quedo desalineada. Ese aviso es lo que hizo visible este defecto en vez de dejarlo en verde.
    secrets:
      port-client-id: ${{ secrets.port-client-id || secrets.PORT_CLIENT_ID }}
      port-client-secret: ${{ secrets.port-client-secret || secrets.PORT_CLIENT_SECRET }}
      app-id: ${{ secrets.app-id || secrets.APP_ID_AGENTICO }}
      app-key: ${{ secrets.app-key || secrets.APP_KEY_AGENTICO }}
