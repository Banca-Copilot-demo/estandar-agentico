name: Publicar version

# WORKFLOW REUTILIZABLE. Lo invocan los repositorios de dominio al empujar una etiqueta.
#
# POR QUE VIVE AQUI Y NO EN CADA DOMINIO: es el paso que CONVIERTE contenido en algo instalable.
# Si cada dominio tuviera su propia copia, cada equipo podria quitarse el sello, el empaquetado
# determinista o la revalidacion, y el indice no podria confiar en nada.
#
# LO QUE ESTE WORKFLOW NO HACE: no escribe en el repositorio del dominio. Lo que sale de aqui son
# tres cosas inmutables -- una etiqueta, un paquete firmado y dos atestaciones --. El veredicto NO
# se commitea en `GOVERNANCE.json`: seria un bucle de commits, y meter el digest dentro del
# archivo que se hashea es circular.

on:
  # ESTE REPOSITORIO TAMBIEN PUBLICA. Ofrece este workflow a los repositorios de dominio Y lo aplica
  # a su propio plugin, que vive en `plugins/asistente-autoria/` como en cualquier otro repo. Es la
  # unica forma de que el asistente de autoria entre al catalogo con su etiqueta, su release y su
  # firma en vez de por una entrada escrita a mano — que es justo el atajo que el track cierra.
  #
  # Un archivo puede declarar los dos disparadores: `workflow_call` para quien lo invoca y `push`
  # para si mismo. La logica no se duplica, que es lo que pasaria con un workflow llamador aparte.
  push:
    tags:
      - "v*.*.*"
      - "*--v*.*.*"
  workflow_call:
    inputs:
      repositorio-indice:
        description: Repositorio del indice al que avisar. Vacio = no se avisa.
        required: false
        type: string
        default: ""
    secrets:
      port-client-id:
        description: Client ID de Port. Sin el, no se publica la ficha del catalogo.
        required: false
      port-client-secret:
        description: Client secret de Port.
        required: false
      app-id:
        description: >
          App ID de la App del ciclo de vida. Se usa SOLO para acunar un token efimero con el que
          disparar un evento en el repositorio del indice -- no se escribe nada alli --. Opcional:
          sin el, la publicacion se completa y el indice se pone al dia en su pasada programada.
        required: false
      app-key:
        description: Clave privada de esa App. Solo sirve para pedir tokens, nunca es un token.
        required: false
      copilot-token:
        description: >
          Token con permiso `Copilot Requests` para la evaluacion que decide la certificacion. Solo
          hace falta mientras la organizacion no tenga asientos de Copilot propios. Sin el, el
          artefacto se publica igual y se queda en Conforme.
        required: false

# EL PERMISO MINIMO PARA CADA COSA, y ni uno mas:
#   contents: write        -> crear el release y subirle el paquete
#   id-token: write        -> el OIDC de Sigstore; es lo que hace la firma sin claves guardadas
#   attestations: write    -> registrar las dos atestaciones en el repositorio
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    outputs:
      # La subruta de la unidad publicada. La necesita la certificacion para acotarse a ELLA: sin
      # eso, un artefacto se quedaria sin certificar por el estado de la suite de un vecino.
      subruta: ${{ steps.sellar.outputs.subruta }}
    steps:
      - name: Descargar el contenido que se va a sellar
        uses: actions/checkout@v4
        with:
          # El empaquetado sale de `git ls-files`, asi que necesita el repositorio, no un export.
          fetch-depth: 1

      - name: Sellar y publicar
        id: sellar
        uses: Banca-Copilot-demo/estandar-agentico/.github/actions/publicar@main
        with:
          repositorio-indice: ${{ inputs.repositorio-indice }}
          # DOS FUENTES, por los dos disparadores: como PARAMETRO cuando lo invoca un repositorio de
          # dominio, y del repositorio u organizacion cuando lo dispara un `push` de aqui. Las tres
          # son opcionales, asi que sin ellas la publicacion se completa igual -- la ficha y el aviso
          # al indice son aceleradores, la garantia la da el sello --.
          port-client-id: ${{ secrets.port-client-id || secrets.PORT_CLIENT_ID }}
          port-client-secret: ${{ secrets.port-client-secret || secrets.PORT_CLIENT_SECRET }}
          app-id: ${{ secrets.app-id || secrets.APP_ID_AGENTICO }}
          app-key: ${{ secrets.app-key || secrets.APP_KEY_AGENTICO }}

  # LA EVALUACION QUE DECIDE LA CERTIFICACION, y es distinta de la del pull request.
  #
  # LA DEL PULL REQUEST decide si el CAMBIO avanza; esta decide el ESTADO, y por eso recae sobre el
  # commit ETIQUETADO -- el contenido que quedo sellado y que alguien instalara --, no sobre el de una
  # rama. Suelen coincidir, pero certificar por lo que se vio en otro sitio seria certificar de oidas.
  #
  # NO BLOQUEA LA PUBLICACION porque llega despues: el artefacto ya esta publicado y sellado. Lo unico
  # que decide es si se promociona.
  certificar:
    needs: publicar
    uses: Banca-Copilot-demo/estandar-agentico/.github/workflows/evaluar.yml@main
    with:
      ref: ${{ github.ref }}
      # ACOTADA A LA UNIDAD QUE SE PUBLICA. Sin esto, la certificacion corre TODAS las suites del
      # repositorio, y esta medido lo que pasa: `revisar-jql` pasaba sus 3 de 3 y aun asi no se
      # certificaba, porque la suite de un agente de OTRO plugin estaba en rojo.
      subruta: ${{ needs.publicar.outputs.subruta }}
    secrets:
      copilot-token: ${{ secrets.copilot-token || secrets.COPILOT_GITHUB_TOKEN }}

  # SOLO SI LA EVALUACION SE SUPERO. Sin suites -- `sin_suites` -- el artefacto se queda en Conforme,
  # que es el resultado correcto: nadie ha medido su comportamiento.
  promocionar:
    needs: certificar
    if: needs.certificar.outputs.resultado == 'superada'
    uses: Banca-Copilot-demo/estandar-agentico/.github/workflows/promocionar.yml@main
    with:
      etiqueta: ${{ github.ref_name }}
