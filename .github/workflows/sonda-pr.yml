name: Sonda de disparo en pull request

# TEMPORAL, para un diagnostico: las comprobaciones requeridas no reportan en el primer pull request
# de este repositorio, y hay dos causas posibles que se excluyen entre si -- el filtro de `paths` del
# workflow de pruebas, o que los eventos `pull_request` no lleguen a disparar nada aqui --.
#
# Esta sonda no lleva filtro. Si corre, el problema es el filtro; si no corre, el problema es el
# disparador. Se borra en cuanto se sepa cual de las dos es.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sonda:
    name: Sonda
    runs-on: ubuntu-latest
    steps:
      - name: Decir que el evento llego
        shell: bash
        run: echo "el evento pull_request SI dispara workflows en este repositorio"
