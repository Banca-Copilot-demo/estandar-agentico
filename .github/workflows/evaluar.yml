name: Evaluar el comportamiento

# EJECUTA LAS SUITES DE EVALUACION del repositorio que llama, y dice si pasan.
#
# CUANDO BLOQUEA Y CUANDO NO. Evaluar es opcional; tener evaluaciones ROTAS, no. Un repositorio sin
# suites salta este trabajo -- y un trabajo saltado reporta «Success», asi que no impide mergear
# aunque la comprobacion sea requerida (MEDIDO: el pull request queda CLEAN) --. Uno que si las trae
# esta declarando que quiere certificar, y entonces una suite en rojo detiene el cambio (MEDIDO:
# queda BLOCKED). Es como funcionan las pruebas en cualquier repositorio: lo opcional es tenerlas.
#
# SE EJECUTA UNA SOLA VEZ POR ARTEFACTO, EN LA SOLICITUD DE CAMBIO, y ya no al publicar. La
# publicacion tenia su propia corrida sobre el commit etiquetado, y esa segunda pasada hacia dano en
# vez de dar garantia: el veredicto NO es reproducible -- MEDIDO sobre el MISMO contenido: 3 de 3 en
# el pull request, 2 de 3 al certificar y verde al reejecutar --, asi que evaluar dos veces solo
# multiplica las ocasiones de que el azar diga cosas distintas del mismo artefacto, y duplica el
# consumo del unico token de inferencia de la organizacion. El etiquetado es automatico justo tras el
# merge, asi que la etiqueta apunta al commit del merge y el contenido evaluado es EL MISMO.
#
# EL INPUT `subruta` SE RETIRO CON ELLA. Existia solo para acotar la certificacion a la unidad que se
# publicaba; sin esa corrida no le quedaba ningun consumidor -- comprobado en los repositorios de
# dominio --, y un input documentado y sin usar es una invitacion a volver a cablear la segunda
# pasada. La capacidad de acotar no se perdio: vive en la accion `detectar-suites`, que es quien la
# usa hoy desde la publicacion para preguntar si la unidad TRAE suites.
#
# EL FILTRO DE RUTAS NO SIRVE PARA ESTO y es el error clasico: con `on: pull_request: paths:` la
# comprobacion NO SE REPORTA cuando no hay coincidencia, y una requerida que nunca reporta deja el
# pull request bloqueado para siempre. Por eso la condicion vive en el JOB, no en el disparador.
#
# SE EJECUTA DESPUES DE LOS CONTROLES DETERMINISTAS, nunca en paralelo. Los controles no consumen
# modelo y tardan segundos; una suite tarda MEDIDOS ~2,5-3,5 minutos y gasta cuota de inferencia.
# Evaluar un artefacto cuyo frontmatter esta mal formado es pagar por descubrir algo que ya se sabia.
# Quien llame a este workflow debe encadenarlo con `needs:` al de validacion.
on:
  workflow_call:
    inputs:
      ref:
        description: El commit a evaluar. Por defecto, el que disparo al llamador.
        required: false
        type: string
        default: ""
    outputs:
      resultado:
        description: "`superada`, `sin_suites` o `fallida`. Es el veredicto que decide si el cambio avanza."
        value: ${{ jobs.evaluar.outputs.resultado }}
    secrets:
      copilot-token:
        description: >
          Token con permiso `Copilot Requests`. Solo hace falta cuando la ORGANIZACION no tiene
          asientos de Copilot: entonces el token de Actions hereda esa carencia y el CLI responde
          «Access denied by policy settings». Con asientos en la organizacion se puede omitir.
        required: false

permissions:
  contents: read

# NO SE PIDE `copilot-requests: write`, y la razon importa mas que la linea.
#
# Ese permiso solo hace falta cuando el CLI se autentica con el `GITHUB_TOKEN` del propio workflow.
# Con un token que preste una suscripcion -- `copilot-token` -- no interviene para nada.
#
# Y PEDIRLO TIENE UN COSTE QUE NO SE VE HASTA QUE PASA: una organizacion sin asientos de Copilot no
# puede concederlo -- su maximo es `none` --, y entonces el workflow muere en `startup_failure` con
# «is requesting 'copilot-requests: write', but is only allowed 'copilot-requests: none'». MEDIDO: eso
# tumbaba la PUBLICACION entera, antes de empaquetar y sellar, aunque el sellado no necesite Copilot.
# Un permiso para CERTIFICAR mataba el PUBLICAR.
#
# Sin pedirlo, quien use el token del workflow en una organizacion con asientos falla en EJECUCION,
# con un mensaje del propio CLI, y solo se pierde la certificacion. Un fallo diagnosticable y acotado
# en lugar de uno que se lleva por delante toda la cadena.

env:
  # Y2: las versiones son variables, en un solo sitio.
  VERSION_NODE: "22"
  # LA DE PYTHON NO ESTA AQUI a proposito: la pone la accion `detectar-suites` desde el
  # `.python-version` del estandar, y ese interprete queda puesto para todo el job. Un literal aqui
  # seria un segundo sitio donde divergir (Y2) -- y ya divergia: decia "3.13" mientras el estandar
  # declaraba 3.12, o sea que el validador se instalaba en un interprete y las reglas se escribian
  # contra otro.
  # `promptfoo` se fija: una suite que pasa hoy y falla mañana por un cambio del motor seria
  # indistinguible de una regresion del artefacto.
  VERSION_PROMPTFOO: "0.118.16"
  REPO_DEL_ESTANDAR: Banca-Copilot-demo/estandar-agentico
  # DONDE SE CLONA EL ESTANDAR DENTRO DEL WORKSPACE. Vive como variable porque ahora lo usan tres
  # sitios -- el checkout, la instalacion del validador y la busqueda de suites, que debe SALTARSELO --
  # y con el nombre repetido a mano bastaria con cambiarlo en dos para que la busqueda volviera a
  # tragarse las plantillas del estandar (Y2/Y3).
  DIRECTORIO_DEL_ESTANDAR: .estandar
  # LLAMADAS EN VUELO POR CORRIDA. Lo que satura el token no es el numero de trabajos sino el
  # PRODUCTO «trabajos en paralelo x concurrencia interna». Por defecto el motor usa 4; con varias
  # corridas a la vez eso se multiplica, y el agotamiento no se ve como cuota sino como casos en
  # rojo. Acotarlo aqui protege tambien entre repositorios distintos, donde el grupo de concurrencia
  # -- que es por repositorio -- no alcanza.
  LLAMADAS_EN_VUELO: "2"

jobs:
  evaluar:
    name: Evaluacion de comportamiento
    runs-on: ubuntu-latest

    # EL RECURSO QUE COMPITE NO ES EL RUNNER: ES EL TOKEN DE INFERENCIA, uno solo para todo.
    #
    # Y lo peligroso es COMO se manifiesta su agotamiento: no llega como un error de cuota, llega
    # como casos que fallan. Se mide rojo y se cree que el artefacto empeoro. Es el mismo daño que ya
    # aparecio dos veces en esta cadena -- acusar al ARTEFACTO de un fallo de la INFRAESTRUCTURA --,
    # y este es el mas dificil de reconocer porque el resultado parece legitimo.
    #
    # Con el grupo, una segunda evaluacion no arranca: queda pendiente y entra cuando la primera
    # termina. `cancel-in-progress: false` a proposito -- una corrida a medias deja el cambio sin
    # veredicto, y un veredicto ausente es peor que uno lento --.
    #
    # LIMITE CONOCIDO: los grupos de concurrencia son POR REPOSITORIO. Esto serializa las
    # evaluaciones de un repositorio de dominio entre si, pero NO entre dominios distintos, que
    # siguen compartiendo el mismo token. Por eso ademas se acotan las llamadas en vuelo de cada
    # corrida, abajo.
    concurrency:
      group: evaluacion-de-comportamiento
      cancel-in-progress: false

    outputs:
      resultado: ${{ steps.veredicto.outputs.resultado }}
    steps:
      - name: Descargar el repositorio que se evalua
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # HISTORIAL COMPLETO porque en una solicitud de cambio hay que comparar contra la rama base
          # para saber que se toco. Con la profundidad 1 de por defecto, `origin/<base>` no existe y
          # `git diff` falla -- o peor, devuelve vacio y se evaluaria de menos EN SILENCIO --.
          fetch-depth: 0

      # ANTES DE DETECTAR, no despues: la deteccion necesita saber que UNIDADES publica el
      # repositorio para acotar lo que evalua, y esa regla vive en el validador del estandar. Sin
      # esto, el paso de deteccion fallaba porque el puente aun no estaba descargado.
      - name: Descargar el puente y las reglas del estandar
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_DEL_ESTANDAR }}
          path: ${{ env.DIRECTORIO_DEL_ESTANDAR }}

      # QUE ES UNA SUITE Y CUALES CUENTAN LO DECIDE UNA SOLA DEFINICION, la de la accion, y no este
      # archivo. La misma pregunta se la hace la PUBLICACION -- «¿la unidad que se publica trae
      # suites?» -- para decidir si promociona, y dos busquedas escritas a mano divergirian en el
      # primer arreglo (G2/Y1): una unidad podria tener suites para una y no para la otra, y entonces
      # se certificaria por lo que la otra no midio.
      #
      # LA ACCION TAMBIEN DEJA PUESTO EL PYTHON DEL ESTANDAR y el validador instalado, que es lo que
      # necesitan los pasos de mas abajo -- `agente_de_la_suite.py` y el puente --.
      - name: Buscar las suites de evaluacion
        id: detectar
        uses: Banca-Copilot-demo/estandar-agentico/.github/actions/detectar-suites@main
        with:
          # SOLO EN UNA SOLICITUD DE CAMBIO se acota a lo que el cambio toca. En un push a main no hay
          # «lo que cambia», hay un estado que evaluar entero.
          rama-base: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          # El clon del estandar lo mete ESTE workflow en el workspace y no es del repositorio
          # evaluado: la accion tiene que saltarselo o volveria a evaluar sus plantillas.
          directorio-a-podar: ${{ env.DIRECTORIO_DEL_ESTANDAR }}

      - name: Avisar de que no hay nada que evaluar
        if: steps.detectar.outputs.hay-suites != 'true'
        shell: bash
        run: |
          echo "::notice::sin suites de evaluacion: se publicara como Conforme, sin certificar."

      - name: Preparar Node (motor de evaluacion)
        if: steps.detectar.outputs.hay-suites == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSION_NODE }}

      - name: Instalar el CLI de Copilot
        if: steps.detectar.outputs.hay-suites == 'true'
        shell: bash
        run: npm install -g @github/copilot

      # SIN ESTE PASO LA EVALUACION MIDE EL MODELO BASE, NO EL ARTEFACTO, y pasa igual.
      #
      # Copilot descubre los skills de un proyecto en `.github/skills/`, `.claude/skills/` y
      # `.agents/skills/`, y los agentes en `.github/agents/`. Un repositorio de dominio los guarda
      # en `skills/<n>/` y `plugins/<p>/agents/`, que NO son rutas de descubrimiento.
      #
      # MEDIDO, y es el defecto mas enganoso de todos los de esta cadena: sin colocarlos, la suite de
      # `revisar-jql` daba 3 de 3 -- en verde -- con el skill sin cargar. O sea que las aserciones se
      # cumplian por conocimiento general del modelo y la evaluacion no probaba nada del artefacto.
      # Un fallo que pasa se lee como cobertura y no lo es.
      - name: Colocar los artefactos donde el cliente los ve
        if: steps.detectar.outputs.hay-suites == 'true'
        shell: bash
        run: |
          mkdir -p .github/skills .github/agents
          # SE PODA EL CLON DEL ESTANDAR, igual que en la busqueda de suites y por una razon PEOR.
          # Este directorio lo crea este mismo workflow y no pertenece al repositorio evaluado, asi
          # que sin podarlo se copian al cliente los skills del asistente de autoria Y el `SKILL.md`
          # de `plantillas/`, que es un ESQUELETO con marcadores sin rellenar.
          #
          # MEDIDO en el run 33018092035 de `agentes-sdlc`, donde se evaluaba `planificar-migracion`:
          #
          #   skill disponible: planificar-migracion   <- el que se mide
          #   skill disponible: crear-artefacto-agentico
          #   skill disponible: instalar-artefacto-agentico
          #   skill disponible: skill                  <- la PLANTILLA
          #
          # Y NO ES EL MISMO DANO QUE EVALUAR UNA PLANTILLA, es mayor: aquello ponia en rojo una suite
          # ajena, esto CONTAMINA EL ENTORNO en el que se mide el artefacto propio. El cliente elige
          # que skill cargar por su `description`, asi que unos esqueletos ajenos compitiendo por la
          # peticion pueden cambiar el veredicto del artefacto que si se publica -- y cambiarlo hacia
          # cualquier lado, sin dejar rastro de por que --. Contradice el proposito del paso, que
          # existe justamente para que se evalue el artefacto y no lo que hubiera alrededor.
          #
          # Los skills se copian por DIRECTORIO -- un skill es su carpeta con `SKILL.md` y sus
          # recursos --, y los agentes por archivo.
          while IFS= read -r definicion; do
            skill="$(dirname "$definicion")"
            destino=".github/skills/$(basename "$skill")"
            # UNA COLISION DE NOMBRES SE DICE, NO SE TRAGA. `[ -e ]` protege de sobreescribir, pero
            # anunciar «disponible» igualmente convertia el segundo skill en uno que el log daba por
            # colocado y que el cliente nunca vio. En el run de arriba, `skill` aparecia DOS VECES y
            # solo existia uno.
            if [ -e "$destino" ]; then
              echo "::warning::ya habia un skill llamado $(basename "$skill"): se conserva el primero y NO se coloca $skill"
              continue
            fi
            cp -r "$skill" "$destino"
            echo "skill disponible: $(basename "$skill")"
          done < <(find . -path ./.github -prune \
                          -o -path "./$DIRECTORIO_DEL_ESTANDAR" -prune \
                          -o -name SKILL.md -print)

          while IFS= read -r definicion; do
            destino=".github/agents/$(basename "$definicion")"
            if [ -e "$destino" ]; then
              echo "::warning::ya habia un agente llamado $(basename "$definicion"): se conserva el primero y NO se coloca $definicion"
              continue
            fi
            cp "$definicion" "$destino"
            echo "agente disponible: $(basename "$definicion")"
          done < <(find . -path ./.github -prune \
                          -o -path "./$DIRECTORIO_DEL_ESTANDAR" -prune \
                          -o -name "*.agent.md" -print)

      - name: Ejecutar las suites
        id: correr
        if: steps.detectar.outputs.hay-suites == 'true'
        shell: bash
        env:
          # DOS TOKENS, Y EL ORDEN IMPORTA. El CLI busca `COPILOT_GITHUB_TOKEN`, luego `GH_TOKEN` y
          # por ultimo `GITHUB_TOKEN`.
          #
          # MEDIDO: el token de Actions hereda la politica de Copilot de la ORGANIZACION, y una
          # organizacion sin asientos responde «Access denied by policy settings» -- aunque el CLI
          # funcione en la maquina de cualquier desarrollador con suscripcion propia. Por eso se
          # admite un secreto que preste una suscripcion valida; si no existe, se cae al token de
          # Actions, que es lo correcto cuando la organizacion SI tiene asientos.
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot-token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVALS_PROYECTO: ${{ github.workspace }}
        run: |
          set -o pipefail
          cable="${GITHUB_WORKSPACE}/${DIRECTORIO_DEL_ESTANDAR}/evals/puente_copilot.py"
          fallidas=0
          while IFS= read -r suite; do
            echo "::group::$suite"
            # UNA SUITE DE AGENTE SE EJECUTA COMO AGENTE, y una de skill no. No es un matiz:
            #   - de un SKILL se mide si el cliente lo ACTIVA solo, asi que se invoca SIN `--agent`;
            #   - un AGENTE se INVOCA, y sin `--agent` la suite ejecuta al asistente por defecto,
            #     mide otra cosa y falla por una razon que no tiene que ver con el artefacto.
            # MEDIDO: la primera ejecucion de este gate corrio las dos igual y la del agente dio 1 de
            # 3 -- el informe acusaba al ARTEFACTO de un fallo de la HERRAMIENTA --.
            EVALS_AGENTE="$(python "${GITHUB_WORKSPACE}/${DIRECTORIO_DEL_ESTANDAR}/evals/agente_de_la_suite.py" "$suite")"
            export EVALS_AGENTE
            [ -n "$EVALS_AGENTE" ] && echo "se invoca al agente $EVALS_AGENTE"
            # `--no-cache` porque una suite que pasa por cache no ha probado nada.
            if npx --yes "promptfoo@${VERSION_PROMPTFOO}" eval \
                 -c "$suite" -r "file://$cable" --grader "file://$cable" \
                 -j "$LLAMADAS_EN_VUELO" --no-cache; then
              echo "superada: $suite"
            else
              echo "::error::la suite $suite NO pasa"
              fallidas=$((fallidas + 1))
            fi
            echo "::endgroup::"
          done < "${{ steps.detectar.outputs.archivo-suites }}"

          if [ "$fallidas" -gt 0 ]; then
            echo "resultado=fallida" >> "$GITHUB_OUTPUT"
            echo "::error::$fallidas suite(s) no pasan: el artefacto no puede certificarse"
            exit 1
          fi
          echo "resultado=superada" >> "$GITHUB_OUTPUT"

      # EL VEREDICTO SE RESUELVE UNA SOLA VEZ, en un paso, y no en dos expresiones gemelas repartidas
      # entre el output del job y el resumen (Y3). Cuando divergen, el job dice una cosa y el resumen
      # otra sobre la misma corrida -- y es el output el que decide, asi que el humano lee el que no
      # manda.
      - name: Dejar constancia del resultado
        id: veredicto
        if: always()
        shell: bash
        run: |
          # SIN SUITES SOLO SI LA DETECCION DIJO QUE NO HAY. Si las habia y el paso de ejecucion no
          # llego a escribir su resultado, es que murio antes de terminar: eso es `fallida`, nunca
          # «no habia nada que medir». Leerlo al reves certificaria por un fallo de infraestructura.
          resultado="${{ steps.correr.outputs.resultado }}"
          if [ -z "$resultado" ]; then
            [ "${{ steps.detectar.outputs.hay-suites }}" = "true" ] && resultado=fallida || resultado=sin_suites
          fi
          echo "resultado=$resultado" >> "$GITHUB_OUTPUT"
          {
            echo "## Evaluacion de comportamiento"
            echo
            case "$resultado" in
              sin_suites) echo "Sin suites. El artefacto se publicara como **Conforme**: no se distribuye hasta certificarse." ;;
              superada)   echo "Suites superadas. El artefacto puede promocionarse a **Certificado**." ;;
              *)          echo "Suites en rojo. El cambio no avanza hasta corregirlas." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
