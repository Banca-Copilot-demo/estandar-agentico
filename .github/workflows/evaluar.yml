name: Evaluar el comportamiento

# EJECUTA LAS SUITES DE EVALUACION del repositorio que llama, y dice si pasan.
#
# UN TRABAJO POR UNIDAD, Y NO UNO POR REPOSITORIO. Es el cambio que estructura este archivo, y viene
# de un defecto MEDIDO: mientras hubo un solo trabajo para todo, su unica conclusion se contagiaba.
# En el run 33040368778 de `agentes-sdlc`, `revisar-jql` con 3 de 3 y `referencia` con 3 de 3 NO se
# certificaron porque la suite de `migracion` estaba en 2 de 3 -- dos artefactos que cumplian se
# quedaron en Conforme por una unidad que sus equipos no habian tocado --. Acotar la deteccion no
# bastaba: el guardian de la certificacion preguntaba por una senal de REPOSITORIO, y no existia ninguna
# senal por unidad que pudiera preguntar. Con la matriz existe: cada unidad emite SU comprobacion,
# con su nombre, y el guardian busca la suya. De paso el portal de Actions muestra que artefacto
# corre y cual fallo sin abrir un log.
#
# CUANDO BLOQUEA Y CUANDO NO. Evaluar es opcional; tener evaluaciones ROTAS, no. Un repositorio sin
# suites no abre ningun trabajo de matriz -- y el veredicto lo dice como `sin_suites`, no como
# «pasaron todas» --. Uno que si las trae esta declarando que quiere certificar, y entonces una suite
# en rojo detiene el cambio. Es como funcionan las pruebas en cualquier repositorio: lo opcional es
# tenerlas.
#
# QUIEN BLOQUEA ES EL AGREGADOR, NO LAS CELDAS. Con matriz hay N conclusiones y el llamador consume
# UNA. El job `veredicto` las combina y conserva las respuestas distintas -- `superada`, `sin_suites`,
# `fallida`, `no_procede` y `no_evaluable` --, que es lo que no se puede colapsar: certificar exige
# `superada`, y ninguna de las otras cuatro es verde aunque dos de ellas dejen mergear.
#
# EL BRAZO ARRANCA SIEMPRE Y RECHAZA, EN VEZ DE SALTARSE. Es lo que anade `no_evaluable`, y viene de
# un defecto MEDIDO en el commit `f6e00a1a` de `agentes-sdlc`: cuando el gate determinista fallaba, el
# job del llamador se saltaba por su `needs:` y con el se saltaba la LLAMADA entera, asi que los jobs
# de este archivo no llegaban a existir -- un job saltado al menos reporta algo; uno que no se
# materializa no reporta NADA --. La comprobacion requerida `Veredicto de comportamiento` quedaba en
# «Expected — waiting for status», esperando indefinidamente un estado que ya nadie iba a emitir.
# Ahora el llamador entra con `if: always()` y pasa el resultado del gate como input: la deteccion se
# cortocircuita -- cero inferencia sobre un artefacto cuyo formato ya se sabe roto -- y el veredicto
# sale en rojo diciendo POR QUE no se midio.
#
# EL CASO VACIO SE DECIDE ANTES DE LA MATRIZ, con `if:` sobre un booleano, y no se descubre dentro.
# Una matriz sin elementos NO se salta: tumba la corrida al arrancar («does not contain any values»),
# y un `startup_failure` no reporta comprobacion ninguna. Ademas, si se dejara correr, el `result` de
# una matriz saltada es `skipped`, que leido a la ligera pasa por verde -- el mismo modo de fallo del
# trabajo saltado que reporta «Success», ya medido en este proyecto --. Por eso el veredicto mira
# `hay-suites` y no el `result` para distinguir «no habia nada» de «paso todo».
#
# SE EJECUTA UNA SOLA VEZ POR ARTEFACTO, EN LA SOLICITUD DE CAMBIO, Y ESTE ARCHIVO LO HACE CUMPLIR.
#
# La regla ya estaba decidida y ya habia costado una medicion: el veredicto NO es reproducible --
# MEDIDO sobre el MISMO contenido: 3 de 3 en el pull request, 2 de 3 al certificar y verde al
# reejecutar --, asi que evaluar dos veces no confirma nada; solo duplica el gasto del UNICO token de
# inferencia de la organizacion y multiplica las ocasiones de que el azar diga cosas distintas del
# mismo artefacto. Por eso se retiro la corrida de la publicacion.
#
# LO QUE NO SE RETIRO ENTONCES, Y ES LO QUE ESTE ARCHIVO CIERRA AHORA: la del `push` a `main`. Los
# repositorios de dominio disparan su validacion con `pull_request` Y `push: branches: [main]`, y el
# trabajo de comportamiento no distinguia, asi que TODO cambio se evaluaba DOS VECES -- una en la
# rama y otra en el merge --. Sobrevivio sin que nadie la mirara porque nadie la nombraba: la
# publicacion se apoyaba en ella sin decirlo.
#
# NO SE PIDE, SE IMPIDE. Un aviso no gasta menos cuota, y un lineamiento que cada repositorio de
# dominio puede olvidar no es un lineamiento -- la razon por la que estos workflows viven aqui y no
# en cada dominio --. Fuera de una solicitud de cambio, la deteccion no arranca y el veredicto sale
# `no_procede`: sin runner, sin modelo y sin poner nada en rojo. Los llamadores llevan ademas su
# propio `if:` para no encender ni el trabajo.
#
# Y ENTONCES, ¿DE DONDE SACA LA PUBLICACION SU VEREDICTO? De la MISMA corrida del pull request, sin
# volver a evaluar. El nudo es que el merge con squash crea un commit NUEVO en `main` -- otro sha --,
# asi que las comprobaciones cuelgan del commit de la RAMA y no del que se etiqueta. NO se transporta
# nada: un check-run no caduca, asi que sigue ahi; lo que hace el guardian es preguntar primero QUE
# COMMIT SE EVALUO -- `GET /commits/{sha}/pulls` devuelve la solicitud de cambio que introdujo un
# commit -- y mirar las comprobaciones de aquel. Un artefacto de corrida habria caducado a los 30
# dias y habria exigido `actions: read` en cada dominio; re-publicar las comprobaciones sobre `main`
# habria exigido `checks: write` y una segunda copia de la misma verdad.
#
# EL INPUT `subruta` NO EXISTE, y su ausencia es deliberada: acotar a una unidad ya no es cosa del
# llamador, es la estructura misma del workflow -- una celda por unidad --. Un input asi seria hoy la
# forma de volver a colapsar N comprobaciones en una.
#
# EL FILTRO DE RUTAS NO SIRVE PARA ESTO y es el error clasico: con `on: pull_request: paths:` la
# comprobacion NO SE REPORTA cuando no hay coincidencia, y una requerida que nunca reporta deja el
# pull request bloqueado para siempre. Por eso la condicion vive en los JOBS, no en el disparador.
#
# SE EJECUTA DESPUES DE LOS CONTROLES DETERMINISTAS, nunca en paralelo. Los controles no consumen
# modelo y tardan segundos; una suite tarda MEDIDOS ~2,5-3,5 minutos y gasta cuota de inferencia.
# Evaluar un artefacto cuyo frontmatter esta mal formado es pagar por descubrir algo que ya se sabia.
# Quien llame a este workflow debe encadenarlo con `needs:` al de validacion.
on:
  workflow_call:
    inputs:
      ref:
        description: El commit a evaluar. Por defecto, el que disparo al llamador.
        required: false
        type: string
        default: ""
      # EL RESULTADO DEL GATE DETERMINISTA, Y POR QUE ENTRA COMO INPUT EN VEZ DE DEDUCIRSE.
      #
      # Este workflow no ve los jobs del llamador: `needs` vive alla. Sin este dato solo caben dos
      # comportamientos, y los dos son malos -- evaluar un artefacto cuyo formato ya se sabe roto
      # (pagar inferencia por descubrir lo que el gate ya dijo, contra el orden por COSTE CRECIENTE
      # que este archivo defiende), o no arrancar y dejar la comprobacion requerida sin emitir --.
      #
      # EL DEFECTO QUE CIERRA, MEDIDO en el commit `f6e00a1a` de `agentes-sdlc`: con `conformidad` en
      # `failure`, el job `comportamiento` del llamador se saltaba por su `needs:`, y al saltarse el
      # LLAMADOR los jobs de ESTE workflow no se materializan -- no emiten un check-run «skipped»:
      # simplemente NO EXISTEN --. El contexto requerido `comportamiento / Veredicto de
      # comportamiento` se quedaba en «Expected — waiting for status» para siempre.
      #
      # EL DEFECTO POR DEFECTO ES `success` Y NO AL REVES, a proposito: un llamador que no reporta su
      # gate no tiene ningun gate roto que reportar, y exigirlo -- `required: true` -- dejaria a los
      # llamadores existentes muriendo en `startup_failure`, incluido el pull request que anadiria la
      # linea que falta. La seguridad la da el llamador pasando el dato, y este archivo no puede
      # sustituirla por un default pesimista sin bloquearse a si mismo.
      conformidad:
        description: >
          Resultado del gate determinista del llamador (`success`, `failure`, `cancelled`,
          `skipped`). Si no es `success` no se abre ninguna celda de matriz -- cero inferencia -- y el
          veredicto sale `no_evaluable`, en rojo.
        required: false
        type: string
        default: success
    outputs:
      resultado:
        description: >
          `superada`, `sin_suites`, `fallida`, `no_procede` o `no_evaluable`. Es el veredicto que
          decide si el cambio avanza. `no_procede` significa que no se invoco desde una solicitud de
          cambio y por tanto no se evaluo nada: NO es verde, pero tampoco detiene nada -- lo que se
          evalua es la rama, una sola vez --. `no_evaluable` significa que el gate determinista del
          llamador no paso: no se midio nada, y por eso detiene el cambio igual que `fallida`.
        value: ${{ jobs.veredicto.outputs.resultado }}
    secrets:
      copilot-token:
        description: >
          Token con permiso `Copilot Requests`. Solo hace falta cuando la ORGANIZACION no tiene
          asientos de Copilot: entonces el token de Actions hereda esa carencia y el CLI responde
          «Access denied by policy settings». Con asientos en la organizacion se puede omitir.
        required: false

permissions:
  contents: read

# EL RECURSO QUE COMPITE NO ES EL RUNNER: ES EL TOKEN DE INFERENCIA, uno solo para todo.
#
# Y lo peligroso es COMO se manifiesta su agotamiento: no llega como un error de cuota, llega como
# casos que fallan. Se mide rojo y se cree que el artefacto empeoro. Es el mismo daño que ya aparecio
# dos veces en esta cadena -- acusar al ARTEFACTO de un fallo de la INFRAESTRUCTURA --, y este es el
# mas dificil de reconocer porque el resultado parece legitimo.
#
# EL GRUPO ESTA AQUI ARRIBA Y NO EN EL JOB, y con la matriz esa diferencia dejo de ser cosmetica: un
# grupo de concurrencia declarado en un job de matriz lo comparten TODAS sus celdas, y GitHub solo
# guarda UNA en espera por grupo -- las demas se cancelan entre si --. Es decir, poner el grupo abajo
# convertiria la matriz en «se evalua una unidad y las otras se cancelan solas», que es peor que el
# defecto que este archivo arregla. A nivel de workflow el grupo serializa CORRIDAS enteras, que es
# lo que siempre se quiso decir, y dentro de cada una el paralelismo lo acota `max-parallel`.
#
# `cancel-in-progress: false` a proposito -- una corrida a medias deja el cambio sin veredicto, y un
# veredicto ausente es peor que uno lento --.
#
# LIMITE CONOCIDO: los grupos de concurrencia son POR REPOSITORIO. Esto serializa las evaluaciones de
# un repositorio de dominio entre si, pero NO entre dominios distintos, que siguen compartiendo el
# mismo token. Por eso ademas se acotan las llamadas en vuelo de cada corrida, abajo.
concurrency:
  group: evaluacion-de-comportamiento
  cancel-in-progress: false

# NO SE PIDE `copilot-requests: write`, y la razon importa mas que la linea.
#
# Ese permiso solo hace falta cuando el CLI se autentica con el `GITHUB_TOKEN` del propio workflow.
# Con un token que preste una suscripcion -- `copilot-token` -- no interviene para nada.
#
# Y PEDIRLO TIENE UN COSTE QUE NO SE VE HASTA QUE PASA: una organizacion sin asientos de Copilot no
# puede concederlo -- su maximo es `none` --, y entonces el workflow muere en `startup_failure` con
# «is requesting 'copilot-requests: write', but is only allowed 'copilot-requests: none'». MEDIDO: eso
# tumbaba la PUBLICACION entera, antes de empaquetar y sellar, aunque el sellado no necesite Copilot.
# Un permiso para CERTIFICAR mataba el PUBLICAR.
#
# Sin pedirlo, quien use el token del workflow en una organizacion con asientos falla en EJECUCION,
# con un mensaje del propio CLI, y solo se pierde la certificacion. Un fallo diagnosticable y acotado
# en lugar de uno que se lleva por delante toda la cadena.

env:
  # Y2: las versiones son variables, en un solo sitio.
  VERSION_NODE: "22"
  # LA DE PYTHON NO ESTA AQUI a proposito: la pone la accion `detectar-suites` desde el
  # `.python-version` del estandar, y ese interprete queda puesto para todo el job. Un literal aqui
  # seria un segundo sitio donde divergir (Y2) -- y ya divergia: decia "3.13" mientras el estandar
  # declaraba 3.12, o sea que el validador se instalaba en un interprete y las reglas se escribian
  # contra otro.
  # `promptfoo` se fija: una suite que pasa hoy y falla mañana por un cambio del motor seria
  # indistinguible de una regresion del artefacto.
  VERSION_PROMPTFOO: "0.118.16"
  REPO_DEL_ESTANDAR: Banca-Copilot-demo/estandar-agentico
  # DONDE SE CLONA EL ESTANDAR DENTRO DEL WORKSPACE. Vive como variable porque ahora lo usan tres
  # sitios -- el checkout, la instalacion del validador y la busqueda de suites, que debe SALTARSELO --
  # y con el nombre repetido a mano bastaria con cambiarlo en dos para que la busqueda volviera a
  # tragarse las plantillas del estandar (Y2/Y3).
  DIRECTORIO_DEL_ESTANDAR: .estandar
  # LLAMADAS EN VUELO POR CORRIDA. Lo que satura el token no es el numero de trabajos sino el
  # PRODUCTO «trabajos en paralelo x concurrencia interna». Por defecto el motor usa 4; con varias
  # corridas a la vez eso se multiplica, y el agotamiento no se ve como cuota sino como casos en
  # rojo. Acotarlo aqui protege tambien entre repositorios distintos, donde el grupo de concurrencia
  # -- que es por repositorio -- no alcanza.
  LLAMADAS_EN_VUELO: "2"
  # UNIDADES QUE SE EVALUAN A LA VEZ, el otro factor de ese mismo producto. Con la matriz, el numero
  # de trabajos simultaneos dejo de ser 1 y pasa a ser el de unidades del repositorio, que crece con
  # el inventario y sin tope se multiplicaria por las llamadas en vuelo de cada uno hasta agotar el
  # token -- y su agotamiento, otra vez, no se lee como cuota sino como casos en rojo: la matriz
  # acusaria a los artefactos de un fallo de la infraestructura, y con N nombres en el portal para
  # hacerlo creible --. Dos por dos son cuatro llamadas en vuelo, el mismo techo que habia antes de
  # la matriz: se gana el aislamiento entre unidades sin subir la presion sobre el token.
  UNIDADES_EN_PARALELO: "2"
  # DONDE ATERRIZA EL INFORME DEL JUEZ, en ABSOLUTO y declarado en un solo sitio (Y2/Y5).
  #
  # ABSOLUTO Y NO RELATIVO porque lo usan DOS pasos -- el que corre las suites y el que los sube -- y el
  # segundo es una accion, que no hereda el directorio de trabajo del primero. Es el bug silencioso que
  # Y5 describe: el directorio existe, esta vacio, y el artefacto se sube sin nada dentro.
  #
  # FUERA DE `~/.promptfoo`, que es donde el motor los deja cuando nadie le pasa `-o`: ese directorio es
  # del RUNNER y muere con el. Ahi vivia el defecto -- el veredicto de la rubrica se escribia y se tiraba
  # a la basura --.
  DIRECTORIO_DE_INFORMES: ${{ github.workspace }}/informes-de-evaluacion

jobs:
  # QUE UNIDADES HAY QUE EVALUAR. Es barato -- no habla con ningun modelo -- y por eso puede correr
  # siempre que proceda evaluar: lo que decide es si se abre matriz y con cuantos elementos.
  unidades:
    name: Unidades con suites
    runs-on: ubuntu-latest
    # AQUI SE CIERRA LA SEGUNDA PASADA, y se cierra en el primer job para que fuera de un pull
    # request no se encienda NI UN RUNNER: si esta condicion viviera en el job de la matriz, la
    # deteccion se pagaria igual en cada push a main. La suite se ejecuta UNA vez, sobre la rama; el
    # commit de `main` que nace del squash tiene otro sha pero el MISMO contenido, y quien publica
    # resuelve de que commit colgaba la medicion en vez de repetirla.
    #
    # Y AQUI SE CIERRA TAMBIEN EL CORTOCIRCUITO POR CONFORMIDAD, en el MISMO sitio y por la misma
    # razon: si el gate determinista del llamador no paso, no se abre NI UNA celda de matriz y no se
    # gasta una sola llamada al modelo en un artefacto cuyo formato ya se sabe roto. El veredicto de
    # abajo si corre -- `if: always()` --, y sale `no_evaluable`: el brazo entero ARRANCA y RECHAZA,
    # en vez de saltarse y dejar la comprobacion requerida esperando un estado que no llegara nunca.
    if: github.event_name == 'pull_request' && inputs.conformidad == 'success'
    outputs:
      lista: ${{ steps.detectar.outputs.unidades-con-suites }}
      hay-suites: ${{ steps.detectar.outputs.hay-suites }}
    steps:
      - name: Descargar el repositorio que se evalua
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # HISTORIAL COMPLETO porque en una solicitud de cambio hay que comparar contra la rama base
          # para saber que se toco. Con la profundidad 1 de por defecto, `origin/<base>` no existe y
          # `git diff` falla -- o peor, devuelve vacio y se evaluaria de menos EN SILENCIO --.
          fetch-depth: 0

      # ANTES DE DETECTAR, no despues: la deteccion necesita saber que UNIDADES publica el
      # repositorio para acotar lo que evalua, y esa regla vive en el validador del estandar. Sin
      # esto, el paso de deteccion fallaba porque el puente aun no estaba descargado.
      - name: Descargar el puente y las reglas del estandar
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_DEL_ESTANDAR }}
          path: ${{ env.DIRECTORIO_DEL_ESTANDAR }}

      # QUE ES UNA SUITE, QUE ES UNA UNIDAD Y CUALES CUENTAN LO DECIDE UNA SOLA DEFINICION, la de la
      # accion, y no este archivo. La misma pregunta se la hace la PUBLICACION -- «¿la unidad que se
      # publica trae suites?» -- para decidir si promociona, y dos busquedas escritas a mano
      # divergirian en el primer arreglo (G2/Y1): una unidad podria tener suites para una y no para
      # la otra, y entonces se certificaria por lo que la otra no midio.
      - name: Buscar las suites de evaluacion
        id: detectar
        uses: Banca-Copilot-demo/estandar-agentico/.github/actions/detectar-suites@main
        with:
          # SE ACOTA A LO QUE EL CAMBIO TOCA, que es lo unico que este workflow evalua ya. La rama
          # base existe siempre aqui: fuera de una solicitud de cambio este job no arranca.
          rama-base: ${{ github.base_ref }}
          # El clon del estandar lo mete ESTE workflow en el workspace y no es del repositorio
          # evaluado: la accion tiene que saltarselo o volveria a evaluar sus plantillas.
          directorio-a-podar: ${{ env.DIRECTORIO_DEL_ESTANDAR }}

      - name: Avisar de que no hay nada que evaluar
        if: steps.detectar.outputs.hay-suites != 'true'
        shell: bash
        run: |
          echo "::notice::sin suites de evaluacion: se publicara como Conforme, sin certificar."

  # UNA CELDA POR UNIDAD, Y SU NOMBRE ES EL DE LA UNIDAD.
  #
  # EL NOMBRE NO ES DECORACION: es la senal que consume el guardian de la certificacion. GitHub nombra el
  # check-run de un workflow reutilizable `<job del llamador> / <nombre del job llamado>`, asi que con
  # la unidad dentro del `name:` cada artefacto obtiene una comprobacion propia y localizable por su
  # subruta. Antes solo existia una comprobacion agregada, y preguntar por ella era preguntar por el
  # estado del vecino. Que ademas se lea en el portal -- que unidad corre y cual fallo, sin abrir un
  # log -- es la consecuencia util del mismo cambio.
  evaluar:
    name: Evaluacion de comportamiento — ${{ matrix.unidad }}
    needs: unidades
    # LA GUARDA DEL CASO VACIO, y es obligatoria: `fromJSON('[]')` no produce una matriz que se salte,
    # tumba la corrida al arrancar. Se mira el booleano y no el texto del array porque cualquier
    # diferencia de serializacion -- un espacio, `[ ]` -- romperia la comparacion en silencio.
    if: needs.unidades.outputs.hay-suites == 'true'
    runs-on: ubuntu-latest
    strategy:
      # UNA UNIDAD EN ROJO NO CANCELA A LAS DEMAS. Es literalmente el defecto que este archivo
      # arregla: con `fail-fast` por defecto, la primera suite que fallara dejaria a las otras en
      # `cancelled` y volveriamos a no tener veredicto propio de cada artefacto -- por otra puerta --.
      fail-fast: false
      # EL LITERAL NO ES UN DESCUIDO: `strategy` NO ADMITE EXPRESIONES AQUI. MEDIDO en el run
      # 33067070476 de `agentes-sdlc`, y el modo de fallo es de los peores: con
      # `max-parallel: ${{ needs.unidades.outputs.en-paralelo }}` el job de matriz NO LLEGA A EXISTIR
      # -- no aparece en la lista de trabajos, no emite ninguna comprobacion -- y aun asi su `result`
      # vale `failure`. O sea que el agregador dice «alguna unidad esta en rojo» cuando en realidad
      # no se evaluo ninguna, y en el portal no hay nada que abrir para descubrirlo.
      #
      # EL VALOR SIGUE TENIENDO UN SOLO SITIO DONDE VIVE (P11): la constante `UNIDADES_EN_PARALELO`
      # de arriba, que es donde esta escrito QUE controla y por que vale 2. Que este numero y aquella
      # constante coincidan lo vigila una prueba de forma -- es la unica manera de tener las dos
      # cosas cuando el motor no deja interpolar --.
      max-parallel: 2
      matrix:
        unidad: ${{ fromJSON(needs.unidades.outputs.lista) }}
    steps:
      - name: Descargar el repositorio que se evalua
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Descargar el puente y las reglas del estandar
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_DEL_ESTANDAR }}
          path: ${{ env.DIRECTORIO_DEL_ESTANDAR }}

      # LA MISMA ACCION, ACOTADA A ESTA UNIDAD. No hay una segunda busqueda escrita para la matriz:
      # es el input `subruta` que la accion ya tenia, el mismo que usa la publicacion para preguntar
      # si la unidad que publica trae suites. La celda corre TODAS las suites de su unidad y ninguna
      # de las ajenas, que es lo que hace que su conclusion signifique algo sobre ella sola.
      - name: Buscar las suites de esta unidad
        id: detectar
        uses: Banca-Copilot-demo/estandar-agentico/.github/actions/detectar-suites@main
        with:
          subruta: ${{ matrix.unidad }}
          directorio-a-podar: ${{ env.DIRECTORIO_DEL_ESTANDAR }}

      # LA SUBRUTA NO SIRVE COMO NOMBRE DE ARTEFACTO: lleva barras, y `upload-artifact` las rechaza.
      # Se traduce una sola vez, aqui, en vez de repetir la sustitucion en cada sitio que la nombre.
      - name: Nombrar el artefacto de esta unidad
        id: nombre
        shell: bash
        env:
          UNIDAD: ${{ matrix.unidad }}
        run: |
          echo "slug=$(printf '%s' "$UNIDAD" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      # UNA UNIDAD SIN SUITES NO DEBERIA LLEGAR AQUI -- la matriz sale de la misma deteccion --, y si
      # llega es que las dos proyecciones divergieron. Se dice, y no se traga: una celda verde sin
      # haber medido nada es exactamente la senal que el guardian confundiria con «certificable».
      - name: Detener la celda si esta unidad no trae suites
        if: steps.detectar.outputs.hay-suites != 'true'
        shell: bash
        run: |
          echo "::error::la matriz abrio un trabajo para ${{ matrix.unidad }} pero al acotar a esa subruta no aparece ninguna suite: las dos proyecciones de la deteccion han divergido"
          exit 1

      - name: Preparar Node (motor de evaluacion)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSION_NODE }}

      - name: Instalar el CLI de Copilot
        shell: bash
        run: npm install -g @github/copilot

      # SIN ESTE PASO LA EVALUACION MIDE EL MODELO BASE, NO EL ARTEFACTO, y pasa igual.
      #
      # Copilot descubre los skills de un proyecto en `.github/skills/`, `.claude/skills/` y
      # `.agents/skills/`, y los agentes en `.github/agents/`. Un repositorio de dominio los guarda
      # en `skills/<n>/` y `plugins/<p>/agents/`, que NO son rutas de descubrimiento.
      #
      # MEDIDO, y es el defecto mas enganoso de todos los de esta cadena: sin colocarlos, la suite de
      # `revisar-jql` daba 3 de 3 -- en verde -- con el skill sin cargar. O sea que las aserciones se
      # cumplian por conocimiento general del modelo y la evaluacion no probaba nada del artefacto.
      # Un fallo que pasa se lee como cobertura y no lo es.
      - name: Colocar los artefactos donde el cliente los ve
        shell: bash
        run: |
          mkdir -p .github/skills .github/agents
          # SE PODA EL CLON DEL ESTANDAR, igual que en la busqueda de suites y por una razon PEOR.
          # Este directorio lo crea este mismo workflow y no pertenece al repositorio evaluado, asi
          # que sin podarlo se copian al cliente los skills del asistente de autoria Y el `SKILL.md`
          # de `plantillas/`, que es un ESQUELETO con marcadores sin rellenar.
          #
          # MEDIDO en el run 33018092035 de `agentes-sdlc`, donde se evaluaba `planificar-migracion`:
          #
          #   skill disponible: planificar-migracion   <- el que se mide
          #   skill disponible: crear-artefacto-agentico
          #   skill disponible: instalar-artefacto-agentico
          #   skill disponible: skill                  <- la PLANTILLA
          #
          # Y NO ES EL MISMO DANO QUE EVALUAR UNA PLANTILLA, es mayor: aquello ponia en rojo una suite
          # ajena, esto CONTAMINA EL ENTORNO en el que se mide el artefacto propio. El cliente elige
          # que skill cargar por su `description`, asi que unos esqueletos ajenos compitiendo por la
          # peticion pueden cambiar el veredicto del artefacto que si se publica -- y cambiarlo hacia
          # cualquier lado, sin dejar rastro de por que --. Contradice el proposito del paso, que
          # existe justamente para que se evalue el artefacto y no lo que hubiera alrededor.
          #
          # SE SIGUEN COLOCANDO LOS DEL REPOSITORIO ENTERO Y NO SOLO LOS DE ESTA UNIDAD, a proposito:
          # lo que se acota es QUE SUITE SE CORRE, no que artefactos existen. Un artefacto de dominio
          # puede apoyarse en un vecino del mismo repositorio, y colocar solo el propio mediria algo
          # distinto de lo que el cliente tendra instalado.
          #
          # Los skills se copian por DIRECTORIO -- un skill es su carpeta con `SKILL.md` y sus
          # recursos --, y los agentes por archivo.
          while IFS= read -r definicion; do
            skill="$(dirname "$definicion")"
            destino=".github/skills/$(basename "$skill")"
            # UNA COLISION DE NOMBRES SE DICE, NO SE TRAGA. `[ -e ]` protege de sobreescribir, pero
            # anunciar «disponible» igualmente convertia el segundo skill en uno que el log daba por
            # colocado y que el cliente nunca vio. En el run de arriba, `skill` aparecia DOS VECES y
            # solo existia uno.
            if [ -e "$destino" ]; then
              echo "::warning::ya habia un skill llamado $(basename "$skill"): se conserva el primero y NO se coloca $skill"
              continue
            fi
            cp -r "$skill" "$destino"
            echo "skill disponible: $(basename "$skill")"
          done < <(find . -path ./.github -prune \
                          -o -path "./$DIRECTORIO_DEL_ESTANDAR" -prune \
                          -o -name SKILL.md -print)

          while IFS= read -r definicion; do
            destino=".github/agents/$(basename "$definicion")"
            if [ -e "$destino" ]; then
              echo "::warning::ya habia un agente llamado $(basename "$definicion"): se conserva el primero y NO se coloca $definicion"
              continue
            fi
            cp "$definicion" "$destino"
            echo "agente disponible: $(basename "$definicion")"
          done < <(find . -path ./.github -prune \
                          -o -path "./$DIRECTORIO_DEL_ESTANDAR" -prune \
                          -o -name "*.agent.md" -print)

      - name: Ejecutar las suites
        id: correr
        shell: bash
        env:
          # DOS TOKENS, Y EL ORDEN IMPORTA. El CLI busca `COPILOT_GITHUB_TOKEN`, luego `GH_TOKEN` y
          # por ultimo `GITHUB_TOKEN`.
          #
          # MEDIDO: el token de Actions hereda la politica de Copilot de la ORGANIZACION, y una
          # organizacion sin asientos responde «Access denied by policy settings» -- aunque el CLI
          # funcione en la maquina de cualquier desarrollador con suscripcion propia. Por eso se
          # admite un secreto que preste una suscripcion valida; si no existe, se cae al token de
          # Actions, que es lo correcto cuando la organizacion SI tiene asientos.
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot-token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVALS_PROYECTO: ${{ github.workspace }}
        run: |
          set -o pipefail
          cable="${GITHUB_WORKSPACE}/${DIRECTORIO_DEL_ESTANDAR}/evals/puente_copilot.py"
          mkdir -p "$DIRECTORIO_DE_INFORMES"
          fallidas=0
          while IFS= read -r suite; do
            echo "::group::$suite"
            # UN INFORME POR SUITE, Y EL NOMBRE SALE DE LA RUTA DE LA SUITE. Todas las suites se llaman
            # igual -- `evals/suite.yaml` dentro de cada artefacto --, asi que usar el nombre del archivo
            # haria que la segunda pisara a la primera EN SILENCIO y el informe conservado seria el de
            # otro artefacto. La ruta completa aplanada es lo unico unico que hay aqui.
            informe="${DIRECTORIO_DE_INFORMES}/$(echo "${suite%.*}" | sed 's#^\./##; s#[^A-Za-z0-9._-]#-#g').json"
            # UNA SUITE DE AGENTE SE EJECUTA COMO AGENTE, y una de skill no. No es un matiz:
            #   - de un SKILL se mide si el cliente lo ACTIVA solo, asi que se invoca SIN `--agent`;
            #   - un AGENTE se INVOCA, y sin `--agent` la suite ejecuta al asistente por defecto,
            #     mide otra cosa y falla por una razon que no tiene que ver con el artefacto.
            # MEDIDO: la primera ejecucion de este gate corrio las dos igual y la del agente dio 1 de
            # 3 -- el informe acusaba al ARTEFACTO de un fallo de la HERRAMIENTA --.
            EVALS_AGENTE="$(python "${GITHUB_WORKSPACE}/${DIRECTORIO_DEL_ESTANDAR}/evals/agente_de_la_suite.py" "$suite")"
            export EVALS_AGENTE
            [ -n "$EVALS_AGENTE" ] && echo "se invoca al agente $EVALS_AGENTE"
            # `--no-cache` porque una suite que pasa por cache no ha probado nada.
            #
            # `-o` NO ES UN LUJO DE OBSERVABILIDAD: es lo unico que conserva EL MOTIVO QUE DIO LA
            # RUBRICA. Sin el, el motor escribe en el `~/.promptfoo` del runner -- que muere con el -- y
            # del log solo queda la tabla, con las respuestas truncadas a ~5 lineas y un `[PASS]`/`[FAIL]`
            # pelado. MEDIDO lo que costo: una suite dio 3/3, luego 2/3 y luego verde SOBRE EL MISMO
            # CONTENIDO, y se lleva toda la sesion llamando a eso «azar del modelo» sin poder mirar por
            # que. Esta medido tambien que el caso que falla CUMPLE su ancla determinista
            # (`icontains: bloqueante`), o sea que lo que falla es la rubrica -- y su motivo no estaba en
            # ninguna parte. Hay una decision de politica pendiente del cliente -- repetir N veces y votar
            # por mayoria, con coste x3 o x5 de inferencia -- que no se puede tomar a ciegas.
            #
            # JSON y no HTML: es el formato que trae `gradingResult.reason` de cada asercion, que es
            # exactamente el dato que faltaba. Y CERO INFERENCIA ADICIONAL: se escribe lo ya calculado.
            if npx --yes "promptfoo@${VERSION_PROMPTFOO}" eval \
                 -c "$suite" -r "file://$cable" --grader "file://$cable" \
                 -o "$informe" \
                 -j "$LLAMADAS_EN_VUELO" --no-cache; then
              echo "superada: $suite"
            else
              echo "::error::la suite $suite NO pasa"
              fallidas=$((fallidas + 1))
            fi
            echo "::endgroup::"
          done < "${{ steps.detectar.outputs.archivo-suites }}"

          if [ "$fallidas" -gt 0 ]; then
            echo "::error::$fallidas suite(s) de ${{ matrix.unidad }} no pasan: el artefacto no puede certificarse"
            exit 1
          fi
          echo "todas las suites de ${{ matrix.unidad }} pasan"

      # `if: always()` NO ES DEFENSIVO: ES EL PUNTO ENTERO DEL PASO.
      #
      # El paso de arriba sale con 1 cuando alguna suite no pasa, asi que sin `always()` el informe se
      # subiria SOLO en las corridas verdes -- justo aquellas en las que a nadie le hace falta -- y se
      # perderia en la unica que interesa. Subirlo solo cuando pasa es no subirlo.
      #
      # UN SOLO ARTEFACTO POR CELDA CON UN INFORME POR SUITE DENTRO: `upload-artifact@v4` RECHAZA dos
      # artefactos con el mismo nombre en la misma corrida, y con la matriz hay N celdas subiendo a la
      # vez -- antes habia una sola y el nombre podia ser fijo --. Por eso el nombre lleva la unidad,
      # ya traducida a algo que la accion acepta. `run_attempt` distingue los reintentos, que SI son
      # la misma corrida a efectos de nombre.
      #
      # LA RUTA ES LA MISMA EXPRESION QUE ESCRIBE EL PASO ANTERIOR (Y5): esta accion no comparte el
      # directorio de trabajo del `run`, y un relativo aqui subiria un artefacto vacio sin decirlo.
      - name: Conservar el informe del juez — se sube tambien (y sobre todo) si las suites fallan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-evaluacion-${{ steps.nombre.outputs.slug }}-intento-${{ github.run_attempt }}
          path: ${{ env.DIRECTORIO_DE_INFORMES }}
          # SI NO HAY NADA, SE DICE. El caso en que el motor muere antes de escribir el informe es
          # posible -- y es informacion: significa que no llego a evaluar --. El silencio por defecto de
          # la accion lo haria indistinguible de una corrida sin hallazgos.
          if-no-files-found: warn
          # No hace falta guardarlos noventa dias: sirven para diagnosticar la corrida que los produjo.
          retention-days: 30

  # EL VEREDICTO QUE CONSUME EL LLAMADOR, Y EL QUE BLOQUEA EL CAMBIO.
  #
  # POR QUE HACE FALTA UN JOB APARTE. Con matriz hay N conclusiones y el `output` del workflow es UNA.
  # Combinarlas en el llamador significaria que cada repositorio de dominio escribiera su propia
  # regla de agregacion -- y la parte delicada de esa regla es justo la que no se ve: distinguir
  # `skipped` de `success` --. Vive aqui, una vez, y los llamadores siguen leyendo `resultado` como
  # antes: el contrato del workflow no cambia.
  #
  # `if: always()` ES LA CONDICION DE QUE ESTE JOB EXISTA CUANDO HACE FALTA. Sin el, una celda roja
  # deja este job en `skipped`, y un job saltado reporta «Success»: el gate del pull request pasaria
  # a verde justamente cuando una suite acaba de fallar. Es el defecto documentado de los agregadores
  # requeridos, y aqui seria doblemente grave porque ademas el `resultado` saldria vacio.
  veredicto:
    name: Veredicto de comportamiento
    needs: [unidades, evaluar]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      resultado: ${{ steps.veredicto.outputs.resultado }}
    steps:
      - name: Combinar el resultado de cada unidad
        id: veredicto
        shell: bash
        env:
          # SE PREGUNTA POR EL INPUT Y NO POR EL `result` DE LA DETECCION, porque ese `result` ya no
          # distingue: con el cortocircuito, «no es un pull request» y «la conformidad esta rota»
          # dejan los dos la deteccion en `skipped`, y uno deja mergear mientras el otro debe
          # detener. La causa solo la conserva el dato que entro por la puerta.
          CONFORMIDAD: ${{ inputs.conformidad }}
          DETECCION: ${{ needs.unidades.result }}
          HAY_SUITES: ${{ needs.unidades.outputs.hay-suites }}
          # DE UNA MATRIZ, `result` COLAPSA LAS N CELDAS EN UN SOLO VALOR: `success` si todas pasaron,
          # `failure` si alguna fallo -- y con `fail-fast: false` todas llegan a correr --, `skipped`
          # si la matriz no se abrio.
          EVALUACION: ${{ needs.evaluar.result }}
          UNIDADES: ${{ needs.unidades.outputs.lista }}
        run: |
          # EL ORDEN DE LAS PREGUNTAS ES EL ARREGLO, no un detalle de estilo.
          #
          # 0) FUERA DE UNA SOLICITUD DE CAMBIO NO SE EVALUA, y eso no es un fallo ni un verde. La
          #    deteccion queda `skipped` por su propia condicion -- no por un error --, y decirlo con
          #    un valor propio es lo que impide que alguien lo lea como «paso»: exactamente el error
          #    que se comete con los trabajos saltados, que reportan «Success».
          # 1) SI LA DETECCION NO TERMINO BIEN, NO SE SABE NADA. Que no haya suites que evaluar y que
          #    no se haya podido mirar son cosas distintas, y solo la primera permite publicar.
          #    Leerlas igual certificaria por un fallo de infraestructura.
          # 2) EL CASO VACIO SE DECIDE POR `hay-suites`, NO POR EL `result` DE LA MATRIZ. Una matriz
          #    que no se abre deja `skipped`, y `skipped` leido a la ligera pasa por verde: es el
          #    mismo modo de fallo del trabajo saltado que reporta «Success», ya medido aqui. Con la
          #    senal explicita, «no habia nada que medir» y «paso todo» no pueden confundirse.
          # 3) SOLO `success` DE LA MATRIZ ES `superada`. `cancelled` y `skipped` con suites
          #    presentes son `fallida`: significan que algo impidio medir, y lo que no se midio no se
          #    certifica.
          #
          # LA CONFORMIDAD SE PREGUNTA LA PRIMERA, ANTES QUE NADA, y ese orden es parte del arreglo:
          # con el cortocircuito la deteccion queda `skipped` igual que fuera de un pull request, asi
          # que preguntar por `$DETECCION` antes daria `no_procede` -- que es VERDE y significa «no se
          # invoco desde una solicitud de cambio», una situacion legitima --. Seria un veredicto en
          # verde diciendo que no se pudo evaluar: un control que termina en verde protegiendo nada.
          # Por eso `no_evaluable` es un desenlace PROPIO y en ROJO, y no una reutilizacion del otro:
          # hoy la conformidad ya esta en rojo al lado, pero el dia que alguien la quite de las
          # comprobaciones requeridas, un artefacto sin medir pasaria con dos verdes.
          if [ "$CONFORMIDAD" != "success" ]; then
            resultado=no_evaluable
            detalle="el gate determinista del llamador termino en «${CONFORMIDAD}»: no se evaluo nada, porque evaluar un artefacto cuyo formato ya se sabe roto es pagar inferencia por descubrir lo que el gate ya dijo"
          elif [ "$DETECCION" = "skipped" ]; then
            resultado=no_procede
            detalle="no se invoco desde una solicitud de cambio: la suite se ejecuta UNA sola vez, sobre la rama, y no se repite en el push a main"
          elif [ "$DETECCION" != "success" ]; then
            resultado=fallida
            detalle="la deteccion de suites termino en «${DETECCION}»: no se sabe que habia que evaluar"
          elif [ "$HAY_SUITES" != "true" ]; then
            resultado=sin_suites
            detalle="ninguna unidad tocada por este cambio trae suites"
          elif [ "$EVALUACION" = "success" ]; then
            resultado=superada
            detalle="todas las unidades evaluadas pasan sus suites: ${UNIDADES}"
          else
            resultado=fallida
            detalle="la evaluacion por unidad termino en «${EVALUACION}» sobre ${UNIDADES}"
          fi
          echo "resultado=$resultado" >> "$GITHUB_OUTPUT"
          echo "$detalle"
          {
            echo "## Evaluacion de comportamiento"
            echo
            echo "$detalle"
            echo
            case "$resultado" in
              no_evaluable) echo "**No se pudo evaluar.** El gate determinista esta en rojo, asi que no se abrio ninguna celda de matriz ni se gasto inferencia. Corrige la conformidad y el brazo de evaluacion volvera a medir. Este veredicto NO es verde: lo que no se ha medido no se certifica." ;;
              no_procede) echo "No se evaluo aqui. La medicion vive en la comprobacion del pull request; la publicacion la recupera de aquel commit sin volver a llamar al modelo." ;;
              sin_suites) echo "Sin suites. El artefacto se publicara como **Conforme**: no se distribuye hasta certificarse." ;;
              superada)   echo "Suites superadas. Cada unidad emitio su propia comprobacion y puede certificarse por separado." ;;
              *)          echo "Alguna unidad esta en rojo. Solo esa deja de certificarse: las demas conservan su comprobacion en verde." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # LO QUE BLOQUEA EL PULL REQUEST, y es un paso aparte a proposito: el veredicto se calcula
      # SIEMPRE y se emite como output aunque el cambio no avance -- mezclar «decidir» con «detener»
      # haria que la proxima persona que anadiera una rama al `case` no supiera cual de las dos
      # estaba tocando --.
      #
      # SIN ESTO EL GATE NO GATE-A: con la matriz, la celda roja es un job hermano, no un antecesor
      # del llamador, y el workflow reutilizable terminaria en verde con una suite en rojo dentro.
      - name: Detener el cambio si alguna unidad esta en rojo
        if: steps.veredicto.outputs.resultado == 'fallida'
        shell: bash
        run: |
          echo "::error::la evaluacion de comportamiento no esta en verde: el cambio no avanza hasta corregir las suites de la unidad afectada"
          exit 1

      # UN PASO APARTE Y NO UNA RAMA MAS DEL ANTERIOR (Y4): son dos causas distintas -- «se midio y
      # salio mal» frente a «no se llego a medir» -- y quien mire el portal de Actions tiene que
      # poder distinguirlas por el NOMBRE del paso, sin abrir el log.
      #
      # Y ES UN `exit 1` Y NO UN AVISO: el brazo de evaluacion arranca precisamente para poder
      # RECHAZAR. Si terminara en verde, la comprobacion requerida quedaria satisfecha por un
      # artefacto que nadie evaluo -- el modo de fallo exacto que este cambio cierra --.
      - name: Detener el cambio si no se pudo evaluar por la conformidad
        if: steps.veredicto.outputs.resultado == 'no_evaluable'
        shell: bash
        run: |
          echo "::error::no se evaluo el comportamiento porque el gate determinista no paso: el veredicto no puede decir que si sin haber medido"
          exit 1
