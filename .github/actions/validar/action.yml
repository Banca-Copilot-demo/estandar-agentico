name: Validar artefactos agenticos
description: >
  Ejecuta los gates G1, G3 y G4 sobre el repositorio evaluado. Accion COMPUESTA a proposito:
  asi el workflow reutilizable NO tiene que clonar el repositorio del estandar, que con un
  GITHUB_TOKEN acotado al repo del llamador es imposible cuando el estandar es privado.

inputs:
  token-organizacion:
    description: >
      Token capaz de LEER LOS EQUIPOS de la organizacion, normalmente acuñado de la App del ciclo de
      vida. Opcional: sin el, la accion cae al `GITHUB_TOKEN` del repositorio, que sirve para todo
      menos para eso -- responde 403 --, y G4 degrada a aviso en lugar de comprobar que el `owner_team`
      declarado exista.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # LA VERSION SALE DE `.python-version` DEL ESTANDAR, no de un literal ni de un input con default.
    # Motivo (Y2): "3.12" estaba escrito en SEIS sitios -- tres workflows y el default de las tres
    # composite actions -- y tres defaults independientes divergen en la primera actualizacion que
    # alguien haga con prisa. Un `uses:` relativo a una accion compartida no sirve aqui: estas
    # acciones se invocan CROSS-REPO (`owner/repo/.github/actions/validar@main`) y la ruta relativa
    # se resolveria contra el repositorio del llamador. `python-version-file` es la via que si
    # funciona en los dos casos, y deja UN archivo como fuente de verdad.
    - name: Preparar Python (version del estandar)
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ github.action_path }}/../../../.python-version

    # EL CONTRATO ES EL IMPORT, NO LA RUTA. Antes se invocaba el script con
    # `python ${{ github.action_path }}/../../../validador/validar.py`, y ese `../../../` era
    # fragil y opaco (Y5). Instalado como paquete, el validador se invoca por su modulo y la
    # topologia del repositorio del estandar deja de ser parte del contrato.
    - name: Instalar el validador del estandar
      shell: bash
      run: pip install --quiet "${{ github.action_path }}/../../../validador"

    # `gh skill publish` es EXCLUSIVO DE SKILLS. Medido: ignora prompts, mcp e instructions -- da
    # `ok` incluso con un .mcp.json que no es JSON valido -- y FALLA con "no skills found" si el
    # repositorio no tiene ninguno. Sin esta condicion, un dominio de solo prompts seria
    # rechazado por el motivo equivocado.
    # UN SOLO PASO. Antes habia cuatro: deteccion de skills, comprobacion oficial, validador, y un
    # `if` de bash que agregaba los tres resultados. Ese `if` era una REGLA DE NEGOCIO -- «conforme
    # cuando ninguna comprobacion aplicable falla» -- viviendo en el unico sitio donde no se puede
    # probar ni ejecutar en local.
    #
    # Ahora la regla es una funcion pura del dominio con sus casos cubiertos, y este paso invoca EL
    # MISMO COMANDO que el autor corre en su maquina. Eso es lo que hace que un pull request nazca
    # en verde en vez de rebotar: el gate no tiene una version de CI y otra local.
    #
    # La deteccion de skills tambien se fue: el validador ya recorre el repositorio y lleva el
    # inventario, asi que el `compgen -G "skills/*/SKILL.md"` era una segunda implementacion de algo
    # que el paquete ya sabia.
    # `--anotaciones` es lo que convierte el veredicto en algo accionable: cada hallazgo aparece
    # SOBRE su linea en el diff del pull request, en vez de obligar al autor a leer el registro,
    # buscar la ruta y abrir el archivo. Son comandos de workflow por stdout, asi que NO necesitan
    # ningun permiso ni llamada a la API.
    # `--organizacion` activa G4 de verdad: resuelve `owner_team` contra los equipos REALES. Sin
    # esto el dueno declarado es texto libre y el gate solo comprueba que el campo exista.
    #
    # `--rama-base` activa la regla de que un pull request no mezcle artefactos con firmantes
    # distintos. Solo se pasa cuando ESTO ES un pull request: en un push a main no hay base contra
    # la que comparar, y la regla no aplica.
    - name: Gate de conformidad · G1 G3 G4 + especificacion oficial
      shell: bash
      run: |
        base=""
        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --quiet --depth=1 origin "${GITHUB_BASE_REF}"
          base="--rama-base origin/${GITHUB_BASE_REF}"
        fi
        # `--esquemas` apunta a los esquemas DEL ESTANDAR, no del repositorio validado: el contrato
        # lo publica la plataforma, y dejar que cada dominio traiga los suyos permitiria relajarlos.
        python -m validador_agentico.cli .           --organizacion "${GITHUB_REPOSITORY_OWNER}"           --esquemas "${{ github.action_path }}/../../../schemas"           $base           --anotaciones           --escribir-resumen "$GITHUB_STEP_SUMMARY"           --verbose
      env:
        # EL DE LA APP SI LO HAY, y si no el del repositorio. La diferencia es UNA comprobacion, pero es
        # la que decide si G4 bloquea o solo avisa: el `GITHUB_TOKEN` esta acotado al repositorio y
        # `gh api orgs/<org>/teams` le responde «Resource not accessible by integration (HTTP 403)»
        # -- medido en una ejecucion real --, asi que el validador no puede resolver el `owner_team` y
        # degrada a aviso. Con el de la App, un dueno inexistente pasa a ser ERROR, que es lo que la
        # regla pretende: «sin dueno resoluble no hay a quien avisar cuando este artefacto falle».
        GH_TOKEN: ${{ inputs.token-organizacion || github.token }}
