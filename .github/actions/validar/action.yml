name: Validar artefactos agenticos del estandar
description: >
  Ejecuta los gates G1, G3 y G4 sobre el repositorio evaluado. Accion COMPUESTA a proposito:
  asi el workflow reutilizable NO tiene que clonar el repositorio del estandar, que con un
  GITHUB_TOKEN acotado al repo del llamador es imposible cuando el estandar es privado.

inputs:
  version-python:
    description: Version de Python con la que corre el validador.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Preparar Python ${{ inputs.version-python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.version-python }}

    # EL CONTRATO ES EL IMPORT, NO LA RUTA. Antes se invocaba el script con
    # `python ${{ github.action_path }}/../../../validador/validar.py`, y ese `../../../` era
    # fragil y opaco (Y5). Instalado como paquete, el validador se invoca por su modulo y la
    # topologia del repositorio del estandar deja de ser parte del contrato.
    - name: Instalar el validador del estandar
      shell: bash
      run: pip install --quiet "${{ github.action_path }}/../../../validador"

    # `gh skill publish` es EXCLUSIVO DE SKILLS. Medido: ignora prompts, mcp e instructions -- da
    # `ok` incluso con un .mcp.json que no es JSON valido -- y FALLA con "no skills found" si el
    # repositorio no tiene ninguno. Sin esta condicion, un dominio de solo prompts seria
    # rechazado por el motivo equivocado.
    - name: ¿Hay skills en el repositorio?
      id: hay
      shell: bash
      run: |
        if compgen -G "skills/*/SKILL.md" > /dev/null || [ -f SKILL.md ]; then
          echo "skills=si" >> "$GITHUB_OUTPUT"
        else
          echo "skills=no" >> "$GITHUB_OUTPUT"
          echo "Sin skills: se omite la validacion de la especificacion Agent Skills." >> "$GITHUB_STEP_SUMMARY"
        fi

    # AGREGA, NO FALLA RAPIDO. Medido: con los pasos en serie, el validador oficial encontro 3
    # errores, aborto, y los gates del estandar -higiene e inventario- NUNCA CORRIERON. El desarrollador
    # veia 3 de 5 defectos y no se enteraba del token literal que llevaba dentro.
    - name: G1 | conformidad con la especificacion Agent Skills
      id: espec
      if: steps.hay.outputs.skills == 'si'
      shell: bash
      continue-on-error: true
      run: gh skill publish --dry-run
      env:
        GH_TOKEN: ${{ github.token }}

    - name: G1 G3 G4 | validador del estandar agentico
      id: agentico
      shell: bash
      continue-on-error: true
      run: python -m validador_agentico.cli . --verbose

    - name: Veredicto agregado de los gates
      shell: bash
      run: |
        ESPEC='${{ steps.espec.outcome }}'
        el estandar='${{ steps.agentico.outcome }}'
        [ "$ESPEC" = "skipped" ] && ESPEC="no aplica (sin skills)"
        {
          echo "## Veredicto de conformidad"
          echo
          echo "| Gate | Resultado |"
          echo "|---|---|"
          echo "| Especificacion Agent Skills | $ESPEC |"
          echo "| Estandar del estandar (G1 G3 G4) | $el estandar |"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$el estandar" = "success" ] && { [ "$ESPEC" = "success" ] || [ "$ESPEC" = "no aplica (sin skills)" ]; }; then
          echo "**CONFORME** | cero consumo de modelo" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "**NO CONFORME** | corrige TODO lo listado arriba antes de volver a empujar" >> "$GITHUB_STEP_SUMMARY"
        exit 1
