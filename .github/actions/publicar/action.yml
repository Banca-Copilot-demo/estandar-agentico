name: Publicar un artefacto agentico del estandar
description: >
  Sella una version: revalida, empaqueta de forma determinista, atesta el veredicto y publica un
  release inmutable. Accion COMPUESTA por el mismo motivo que la de validacion: el GITHUB_TOKEN
  del repo del dominio no puede clonar el repo del estandar cuando este es privado.

inputs:
  repositorio-indice:
    description: >
      Repositorio del indice al que se avisa que hay una version nueva. Vacio = no se avisa.
    required: false
    default: ""
  port-client-id:
    description: Client ID de Port. Vacio = no se publica la ficha en el catalogo.
    required: false
    default: ""
  port-client-secret:
    description: Client secret de Port.
    required: false
    default: ""
  app-id:
    description: >
      App ID de la App del ciclo de vida. Solo se usa para acunar un token EFIMERO con el que
      despertar al indice; ver el paso «Avisar al repositorio del indice». Vacio = no se avisa, y la
      publicacion se completa igual.
    required: false
    default: ""
  app-key:
    description: Clave privada de esa App. Solo sirve para PEDIR tokens, nunca es un token.
    required: false
    default: ""

outputs:
  digest:
    description: sha256 del paquete. Es el sujeto de la atestacion y lo que fija la instalacion.
    value: ${{ steps.empaquetar.outputs.digest }}
  version:
    description: Version publicada, derivada de la etiqueta.
    value: ${{ steps.etiqueta.outputs.version }}

runs:
  using: composite
  steps:
    # PUBLICAR SOLO DESDE UNA ETIQUETA. Un release derivado de una rama seria movil: la rama
    # avanza y el puntero deja de significar lo mismo. La etiqueta ES el contrato de version.
    - name: Comprobar que se publica desde una etiqueta
      id: etiqueta
      shell: bash
      run: |
        if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
          echo "::error::solo se publica desde una etiqueta; esto es ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
          exit 1
        fi
        # DOS FORMAS DE ETIQUETA: `vX.Y.Z` cuando el repositorio es un solo plugin en la raiz, y
        # `<nombre>--vX.Y.Z` cuando aloja varios. La version es lo que sigue a la ultima `v`; el
        # nombre, lo que precede al `--v`.
        version="${GITHUB_REF_NAME##*--v}"
        version="${version#v}"
        if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::la etiqueta ${GITHUB_REF_NAME} no es vX.Y.Z ni <nombre>--vX.Y.Z"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # La version sale de `.python-version` del estandar: un solo archivo como fuente de verdad. Ver
    # el motivo completo en `.github/actions/validar/action.yml`.
    - name: Preparar Python (version del estandar)
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ github.action_path }}/../../../.python-version

    - name: Instalar el validador del estandar
      shell: bash
      run: pip install --quiet "${{ github.action_path }}/../../../validador"

    # SE REVALIDA AQUI, aunque ya se valido en el pull request. El PR valido un commit; esto
    # publica una ETIQUETA, y nada garantiza que apunten al mismo arbol. Sin este paso, el sello
    # certificaria contenido que ningun gate ha visto.
    - name: Revalidar el contenido que se va a sellar
      id: veredicto
      shell: bash
      run: |
        # CON LOS ESQUEMAS, igual que el gate del pull request. Sin ellos aqui se sellaria un
        # artefacto cuya FORMA no se comprobo, y el veredicto firmado diria «conforme» sobre algo que
        # el gate de la PR si habria rechazado: las dos comprobaciones tienen que ser la misma.
        python -m validador_agentico.cli . --formato json \
          --esquemas "${{ github.action_path }}/../../../schemas" > veredicto.json
        cat veredicto.json

    # DE QUE PLUGIN ES ESTA ETIQUETA. Un repositorio de dominio puede alojar varios, y entonces la
    # etiqueta lleva la forma `<nombre>--vX.Y.Z`: el nombre identifica el plugin y hay que traducirlo
    # a su subruta. La traduccion la hace `listar_plugins`, que usa la MISMA regla que el gate --
    # si discreparan, se publicaria un paquete distinto del que se valido.
    - name: Resolver a que plugin corresponde la etiqueta
      id: plugin
      shell: bash
      run: |
        if [[ "$GITHUB_REF_NAME" == *--v* ]]; then
          buscado="${GITHUB_REF_NAME%%--v*}"
        else
          buscado=""
        fi

        subruta="."
        if [ -n "$buscado" ]; then
          # Sin `-F`: el separador por defecto de awk ya parte por tabuladores, y un tabulador
          # literal dentro del YAML es fragil. Ni las rutas ni los nombres de plugin llevan
          # espacios -- el patron de `name` los prohibe --, asi que no hay ambiguedad.
          subruta="$(python -m validador_agentico.listar_plugins . | awk -v n="$buscado" '$2 == n { print $1 }' | head -1)"
          if [ -z "$subruta" ]; then
            echo "::error::la etiqueta $GITHUB_REF_NAME nombra el plugin '$buscado', que no existe en este commit"
            exit 1
          fi
        fi
        echo "subruta=$subruta" >> "$GITHUB_OUTPUT"
        echo "etiquetado=${buscado:-$GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
        echo "plugin '$buscado' -> subruta '$subruta'"

    - name: Empaquetar de forma determinista
      id: empaquetar
      shell: bash
      run: |
        nombre="${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}.tar.gz"
        digest="$(bash "${{ github.action_path }}/empaquetar.sh" . "$nombre" "${{ steps.plugin.outputs.subruta }}")"
        echo "paquete=$nombre" >> "$GITHUB_OUTPUT"
        echo "digest=$digest"  >> "$GITHUB_OUTPUT"
        echo "$nombre  sha256:$digest"

    # DOS ATESTACIONES, porque prueban cosas distintas.
    #
    # La de PROCEDENCIA responde "quien construyo esto y desde que fuente" -- la firma un
    # workflow reutilizable de GitHub, con OIDC, y eso es lo que la lleva a SLSA Build L3.
    #
    # La del VEREDICTO responde "que gates paso y con que resultado". Es informacion NUESTRA:
    # ninguna atestacion nativa de GitHub la cubre. Va como predicado propio y es lo que permite
    # que el indice exija conformidad probada en vez de creerse un campo de un JSON editable.
    # PREFLIGHT MEDIDO EN LA DEMO. La API de atestaciones NO esta disponible para repositorios
    # PRIVADOS de una organizacion sin plan pagado: el paso de atestacion falla con
    # "Feature not available for the <org> organization", y sin este aviso el mensaje aparece
    # cuatro pasos mas abajo, mezclado con la salida de una accion de terceros.
    - name: ¿Esta organizacion puede atestar este repositorio?
      id: preflight_atestacion
      shell: bash
      continue-on-error: true
      run: |
        privado="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
        if [ "$privado" = "true" ]; then
          echo "::notice::repositorio PRIVADO: atestar exige plan Team o Enterprise en la organizacion. En un plan gratuito solo funciona en repositorios publicos."
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Atestacion de procedencia (SLSA Build L3)
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: ${{ steps.empaquetar.outputs.paquete }}

    - name: Atestacion del veredicto de conformidad
      uses: actions/attest@v2
      with:
        subject-path: ${{ steps.empaquetar.outputs.paquete }}
        predicate-type: https://ejemplo.dev/atestaciones/veredicto-de-conformidad/v1
        predicate-path: veredicto.json

    # RELEASE INMUTABLE. El ajuste es del REPOSITORIO, no de este workflow: si esta activado,
    # GitHub bloquea la etiqueta y los assets y firma el release con Sigstore por su cuenta. Se
    # comprueba y se avisa en vez de fallar, porque activarlo es una decision de la organizacion.
    - name: ¿El repositorio tiene releases inmutables?
      id: preflight_inmutable
      shell: bash
      continue-on-error: true
      run: |
        inmutable="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.immutable_releases // "no expuesto"')"
        echo "releases inmutables: $inmutable"
        if [ "$inmutable" != "true" ]; then
          echo "::warning::los releases de este repositorio NO son inmutables: la etiqueta y los assets se pueden reescribir"
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Registrar los preflights que no se pudieron comprobar
      if: always()
      shell: bash
      env:
        RESULTADO_ATESTACION: ${{ steps.preflight_atestacion.outcome }}
        RESULTADO_INMUTABLE: ${{ steps.preflight_inmutable.outcome }}
      run: |
        for sonda in "atestacion:$RESULTADO_ATESTACION" "releases-inmutables:$RESULTADO_INMUTABLE"; do
          nombre="${sonda%%:*}"
          resultado="${sonda#*:}"
          if [ "$resultado" != "success" ]; then
            echo "::warning::el preflight ${nombre} no se pudo comprobar (${resultado}): su silencio NO significa que este en orden"
          fi
        done

    # DE QUE DEPENDE QUE EL RELEASE NAZCA COMO PRELANZAMIENTO. `prerelease` es la señal NATIVA de
    # «esto no es para consumo general», y es lo que el indice mira para dejar un artefacto fuera del
    # catalogo. Publicar y distribuir dejan de ser el mismo acto: el paquete se sella, se atesta y
    # queda verificable igual, pero no se propaga hasta que lo decida la evaluacion.
    #
    # LA DECISION NO SE TOMA AQUI: se lee de `POLITICA.json`, que es lo que permite cambiar de
    # criterio tocando un valor en vez de tres workflows. Si no se puede leer, se cae del lado
    # restrictivo -- se marca prelanzamiento -- porque el fallo entonces es visible y reversible.
    - name: Resolver la politica de promocion al catalogo
      id: politica
      shell: bash
      run: |
        marca="$(python "${{ github.action_path }}/resolver-politica.py" \
                        "${{ github.action_path }}/../../../POLITICA.json")"
        echo "marca=$marca" >> "$GITHUB_OUTPUT"
        if [ -n "$marca" ]; then
          echo "El release nace como PRELANZAMIENTO: entrara al catalogo al certificarse."
        else
          echo "El release nace COMPLETO: entra al catalogo al publicar."
        fi

    - name: Publicar el release con el paquete
      shell: bash
      run: |
        gh release create "${GITHUB_REF_NAME}" "${{ steps.empaquetar.outputs.paquete }}" \
          ${{ steps.politica.outputs.marca }} \
          --title "${GITHUB_REF_NAME}" \
          --notes "Paquete determinista: sha256 \`${{ steps.empaquetar.outputs.digest }}\`
        Atestado: procedencia (SLSA Build L3) y veredicto de conformidad del estandar.
        Verificalo antes de instalar:
        \`\`\`
        gh attestation verify ${{ steps.empaquetar.outputs.paquete }} --repo ${GITHUB_REPOSITORY}
        \`\`\`" \
          || gh release upload "${GITHUB_REF_NAME}" "${{ steps.empaquetar.outputs.paquete }}" --clobber
      env:
        GH_TOKEN: ${{ github.token }}

    # ══ EL AVISO AL INDICE: DISPARA UN EVENTO, NO ESCRIBE NADA ═════════════════════════════════
    #
    # QUE HACE ESTE PASO, exactamente: una llamada a `/dispatches`, que provoca un EVENTO en el
    # repositorio del indice. Nada mas. No crea, no modifica y no borra ni un archivo alli. El evento
    # DESPIERTA el workflow del indice, y a partir de ese momento todo ocurre DENTRO de ese
    # repositorio con SU PROPIO `GITHUB_TOKEN`: los permisos que escriben el catalogo son INTERNOS
    # del repositorio del indice, no los aporta nadie de fuera.
    #
    # Y EL INDICE NO SE CREE EL AVISO. El `client_payload` solo se escribe en el resumen del run,
    # para saber quien aviso. El indice hace su barrido completo desde cero: descubre por topico,
    # lista etiquetas, descarga y VERIFICA las atestaciones. Un dominio que mintiera en el payload no
    # conseguiria nada. Es un DESPERTADOR, no una instruccion.
    #
    # POR QUE HACE FALTA UNA CREDENCIAL, entonces: el `GITHUB_TOKEN` de un workflow esta acotado a SU
    # repositorio -- es lo que impide que un repo comprometido toque los demas --, asi que no alcanza
    # al del indice. Y `/dispatches` exige permiso de ESCRITURA sobre el repositorio destino: GitHub
    # no ofrece un permiso de «solo tocar el timbre». Es el UNICO punto de todo el diseno donde una
    # credencial cruza de un repositorio a otro.
    #
    # DE AHI QUE SEA UN TOKEN DE LA APP Y NO UN PAT. Lo que se guarda en el repositorio de dominio es
    # la clave privada de la App, que NO es un token: solo sirve para PEDIR uno. El que se acuna dura
    # una hora, va acotado con `repositories:` al repositorio del indice, y muere con el runner. Un
    # PAT seria una credencial de escritura PERMANENTE sobre el catalogo, guardada en cada
    # repositorio de dominio, atada a una persona y que caduca sin avisar.
    # `repositories:` quiere el NOMBRE del repositorio, no `propietario/nombre`, y las expresiones de
    # Actions no tienen `split`. Se calcula aqui en vez de pedir el nombre suelto como input: quien
    # invoca ya declara `propietario/nombre` para la llamada a la API, y pedirlo dos veces seria un
    # sitio mas donde se pueden contradecir.
    - name: Nombre del repositorio del indice
      id: indice
      if: inputs.repositorio-indice != ''
      shell: bash
      run: echo "nombre=${INDICE##*/}" >> "$GITHUB_OUTPUT"
      env:
        INDICE: ${{ inputs.repositorio-indice }}

    - name: Token efimero para despertar al indice
      id: token_indice
      if: inputs.repositorio-indice != '' && inputs.app-id != '' && inputs.app-key != ''
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        owner: ${{ github.repository_owner }}
        # ACOTADO A UN SOLO REPOSITORIO. Sin esto, el token alcanzaria todo lo que la App tenga
        # instalado; para tocar un timbre no hace falta la llave de todo el edificio.
        repositories: ${{ steps.indice.outputs.nombre }}

    - name: Avisar al repositorio del indice
      if: steps.token_indice.outputs.token != ''
      shell: bash
      run: |
        gh api "repos/${{ inputs.repositorio-indice }}/dispatches" \
          -f event_type=version-publicada \
          -F "client_payload[repositorio]=${GITHUB_REPOSITORY}" \
          -F "client_payload[etiqueta]=${GITHUB_REF_NAME}"
      env:
        GH_TOKEN: ${{ steps.token_indice.outputs.token }}

    # EL AVISO OMITIDO DEJA RASTRO. Saltarse este paso es legitimo -- el aviso es un ACELERADOR, y el
    # indice reconstruye el catalogo en su pasada programada -- pero saltarselo EN SILENCIO no: el
    # artefacto no aparece en la vitrina hasta el dia siguiente y nada dice por que. MEDIDO: las dos
    # publicaciones de un repositorio de dominio se saltaron el aviso por falta de credencial, y solo
    # se descubrio leyendo el log paso por paso.
    - name: ¿Por que no se aviso al indice?
      if: steps.token_indice.outputs.token == ''
      shell: bash
      run: |
        if [ -z "${{ inputs.repositorio-indice }}" ]; then
          motivo="este workflow no declara \`repositorio-indice\`"
        elif [ -z "${{ inputs.app-id }}" ] || [ -z "${{ inputs.app-key }}" ]; then
          motivo="faltan los secretos de la App con los que se acuna el token efimero"
        else
          motivo="la App no pudo acunar un token para ${{ inputs.repositorio-indice }}; comprueba que este INSTALADA en ese repositorio y con permiso de contenidos"
        fi
        echo "::notice::no se avisa al indice: ${motivo}. El artefacto YA es instalable; entrara al catalogo en la siguiente pasada programada del indice, no al instante."

    # FASE 4c · LA FICHA. Se construye del PREDICADO FIRMADO -- `veredicto.json` --, no releyendo el
    # repositorio: si se leyera el repositorio, la ficha podria decir algo distinto de lo que se
    # sello, y habria dos fuentes de verdad sobre el mismo artefacto.
    #
    # UPSERT y no POST: la ficha se ACTUALIZA en cada publicacion en vez de duplicarse, que es lo que
    # permite que el `status` refleje siempre el ultimo veredicto.
    - name: Ficha en el catalogo (Port)
      if: inputs.port-client-id != '' && inputs.port-client-secret != ''
      shell: bash
      env:
        ID: ${{ inputs.port-client-id }}
        SECRETO: ${{ inputs.port-client-secret }}
        DIGEST: ${{ steps.empaquetar.outputs.digest }}
        ETIQUETA: ${{ github.ref_name }}
      run: |
        token="$(curl -sf -X POST "https://api.port.io/v1/auth/access_token"           -H 'Content-Type: application/json'           -d "{\"clientId\":\"$ID\",\"clientSecret\":\"$SECRETO\"}"           | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"

        python3 "${{ github.action_path }}/fichas.py"           --veredicto veredicto.json           --repositorio "$GITHUB_REPOSITORY"           --etiqueta "$ETIQUETA"           --sha "$GITHUB_SHA"           --digest "$DIGEST"           --token "$token"

    - name: Resumen de la publicacion
      if: always()
      shell: bash
      run: |
        {
          echo "## Publicacion de ${GITHUB_REF_NAME}"
          echo
          echo "| Que | Valor |"
          echo "|---|---|"
          echo "| Version | ${{ steps.etiqueta.outputs.version }} |"
          echo "| Paquete | \`${{ steps.empaquetar.outputs.paquete }}\` |"
          echo "| Digest | \`sha256:${{ steps.empaquetar.outputs.digest }}\` |"
          echo "| Atestaciones | procedencia + veredicto de conformidad |"
        } >> "$GITHUB_STEP_SUMMARY"
