name: Regenerar el indice de plugins del estandar
description: >
  Descubre los repositorios de dominio, verifica la atestacion de lo que cada uno publico y
  reescribe `marketplace.json` solo con lo probado. Vive en el repo del estandar por el mismo
  motivo que el validador: el codigo que decide que es instalable no puede estar donde lo edite
  un equipo de dominio.

inputs:
  organizacion:
    description: Organizacion de GitHub donde viven los repositorios de dominio.
    required: true
  topico:
    description: Topico que marca un repositorio de dominio.
    required: false
    default: agent-skills
  raiz:
    description: >
      Raiz del repositorio del indice. Las DOS proyecciones se escriben dentro, cada una en la ruta
      donde su cliente la lee -- `.claude-plugin/` para Claude Code y `.github/plugin/` para
      Copilot --. Esas rutas NO son un parametro: las fija cada cliente, y tenerlas aqui invitaba a
      generar una sola y dejar la otra rancia.
    required: false
    default: .
  token:
    description: >
      Token con permiso de LECTURA sobre los repositorios de dominio y sus atestaciones. El
      GITHUB_TOKEN del repositorio del indice NO sirve: esta acotado a su propio repositorio y no
      puede ver los releases de los dominios cuando son privados.
    required: true

outputs:
  indexados:
    description: Numero de plugins que entraron al indice.
    value: ${{ steps.generar.outputs.indexados }}

runs:
  using: composite
  steps:
    # La version sale de `.python-version` del estandar: un solo archivo como fuente de verdad. Ver
    # el motivo completo en `.github/actions/validar/action.yml`.
    - name: Preparar Python (version del estandar)
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ github.action_path }}/../../../.python-version

    - name: Instalar el generador del indice
      shell: bash
      run: pip install --quiet "${{ github.action_path }}/../../../indice"

    - name: Generar el indice exigiendo atestacion verificada
      id: generar
      shell: bash
      run: |
        python -m indice_agentico.cli "${{ inputs.organizacion }}" \
          --topico "${{ inputs.topico }}" \
          --raiz "${{ inputs.raiz }}" \
          --esquemas "${{ github.action_path }}/../../../schemas" \
          --verbose
        # LAS RUTAS SE PREGUNTAN AL CODIGO. Estan declaradas en el enum `Proyeccion`, que es lo que
        # el generador usa para escribirlas: repetirlas aqui crearia un segundo sitio que actualizar
        # al anadir una proyeccion, y el olvido no daria error -- solo dejaria una sin commitear.
        proyecciones="$(python -c "from indice_agentico.adaptadores.marketplace import Proyeccion; print(' '.join(p.ruta for p in Proyeccion))")"
        echo "proyecciones=$proyecciones" >> "$GITHUB_OUTPUT"
        # Se cuenta sobre la primera; las dos llevan las mismas entradas por construccion, y hay una
        # prueba que lo fija.
        primera="${proyecciones%% *}"
        indexados="$(python -c "import json,sys; print(len(json.load(open(sys.argv[1], encoding='utf-8'))['plugins']))" "${{ inputs.raiz }}/$primera")"
        echo "indexados=$indexados" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ inputs.token }}

    # SE COMMITEA SOLO SI CAMBIO. Sin esta comprobacion, cada pasada programada dejaria un commit
    # vacio y el historial del indice se volveria ilegible justo cuando hay que auditarlo.
    - name: Commitear el indice si cambio
      shell: bash
      run: |
        # LAS DOS PROYECCIONES VAN EN EL MISMO COMMIT: si una pudiera avanzar sin la otra, los
        # usuarios de un cliente verian un marketplace mas viejo sin que nada lo indicara.
        read -r -a proyecciones <<< "${{ steps.generar.outputs.proyecciones }}"
        if git diff --quiet -- "${proyecciones[@]}"; then
          echo "El indice no cambio: no se commitea."
          exit 0
        fi
        git config user.name "indice-agentico"
        git config user.email "plataforma-agentica@ejemplo.dev"
        git add "${proyecciones[@]}"
        git commit -m "indice: ${{ steps.generar.outputs.indexados }} plugin(s) con atestacion verificada"
        git push

    - name: Resumen del indice
      if: always()
      shell: bash
      run: |
        {
          echo "## Indice de plugins"
          echo
          echo "Plugins indexados: **${{ steps.generar.outputs.indexados }}**"
          echo
          echo "Los rechazos y su motivo estan en el registro del paso anterior."
          echo "Un rechazo NO es un fallo: el dominio se queda fuera del indice, los demas siguen."
        } >> "$GITHUB_STEP_SUMMARY"
